function resizeImage(file, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg',0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* Come resizeImage(), ma per le firme caricate da una foto/immagine (non per gli altri tipi di
   foto dell'app): esporta in PNG invece che JPEG, cosi' l'immagine mantiene un canale alpha, e
   rimuove automaticamente lo sfondo chiaro — ogni pixel diventa tanto piu' trasparente quanto piu'
   e' chiaro (vicino al bianco della carta), mantenendo il colore originale dell'inchiostro sul
   tratto della firma. Cosi' una firma fotografata su un foglio bianco si sovrappone bene al
   documento (e si puo' scaricare come PNG senza sfondo) invece di portarsi dietro un riquadro
   bianco — richiesta 24/09/2026, commento sull'Artifact ("permetti di esportare le firme in png
   senza sfondo"). Le firme disegnate col dito/mouse (vedi salvataggio in attachHandlers(),
   data-sig-save) sono gia' PNG con sfondo trasparente di per se': il canvas di disegno parte
   trasparente e vengono salvati solo i tratti disegnati, quindi non serve alcuna elaborazione. */
function processFirmaImage(file, cb){
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
      const d = imgData.data;
      for(let i=0;i<d.length;i+=4){
        const luma = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        d[i+3] = Math.round(d[i+3] * (255-luma) / 255);
      }
      ctx.putImageData(imgData, 0, 0);
      cb(canvas.toDataURL('image/png'));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---- osservanze: divide una pagina troppo lunga in più pagine fisiche (max maxPages), ripetendo
   logo/intestazione OSSERVANZE/checklist impresa su ciascuna. Richiede che #docview sia already laid out
   (display:block, non display:none) perché usa getBoundingClientRect()/offsetHeight per misurare. ---- */
function paginateOsservanzePage(pageEl, maxPages){
  const textbox = pageEl.querySelector(':scope > .doc-box[data-oss-textbox]');
  const phraseNodes = textbox ? [...textbox.children] : [];
  const notespecNode = pageEl.querySelector(':scope > [data-oss-flow="notespec"]');
  const fotoNode = pageEl.querySelector(':scope > [data-oss-flow="foto"]');
  const prescrNode = pageEl.querySelector(':scope > [data-oss-flow="prescrizioni"]');
  const footer = pageEl.querySelector(':scope > .doc-footer');
  const headerEls = [...pageEl.querySelectorAll(':scope > .doc-logo-row, :scope > .doc-bar, :scope > .doc-chk-list')];
  const barLabelHtml = pageEl.querySelector(':scope > .doc-bar')?.innerHTML || '';

  const flow = [];
  phraseNodes.forEach(el=>flow.push({type:'phrase', el}));
  if(prescrNode) flow.push({type:'prescr', el:prescrNode});
  if(notespecNode) flow.push({type:'notespec', el:notespecNode});
  if(fotoNode) flow.push({type:'foto', el:fotoNode});
  if(!flow.length) return;

  const vMargins = el => { const cs = getComputedStyle(el); return (parseFloat(cs.marginTop)||0) + (parseFloat(cs.marginBottom)||0); };
  const headerHeight = headerEls.reduce((h,el)=> h + el.offsetHeight + vMargins(el), 0);
  const footerHeight = footer ? footer.offsetHeight + 7 : 0; // border-top(1) + padding-top(6)
  const CONTENT_BUDGET = 1011; // px — .doc-page: min-height 1123 - padding-top 96 - padding-bottom 16
  const availPerPage = CONTENT_BUDGET - headerHeight - footerHeight;
  const TEXTBOX_OVERHEAD = 22; // .doc-box: bordo 1+1 + padding 10+10

  const measured = flow.map(item => ({...item, h: item.el.offsetHeight + vMargins(item.el)}));

  const groups = [];
  let current = [], currentHeight = 0, hasPhraseInCurrent = false;
  for(const item of measured){
    const extra = (item.type==='phrase' && !hasPhraseInCurrent) ? TEXTBOX_OVERHEAD : 0;
    const wouldBe = currentHeight + item.h + extra;
    if(current.length>0 && wouldBe > availPerPage && groups.length < maxPages-1){
      groups.push(current);
      current = [item];
      currentHeight = item.h + (item.type==='phrase' ? TEXTBOX_OVERHEAD : 0);
      hasPhraseInCurrent = item.type==='phrase';
    } else {
      current.push(item);
      currentHeight = wouldBe;
      if(item.type==='phrase') hasPhraseInCurrent = true;
    }
  }
  if(current.length) groups.push(current);
  if(groups.length<=1) return; // entra in una sola pagina, nessuna modifica necessaria
  while(groups.length > maxPages){ const extra = groups.pop(); groups[groups.length-1].push(...extra); }

  const impresaNome = pageEl.dataset.ossImpresa || '';
  const newPages = groups.map(group=>{
    const page = document.createElement('div');
    page.className = 'doc-page';
    page.dataset.ossPage = '1';
    page.dataset.ossImpresa = impresaNome;
    headerEls.forEach((h,idx)=>{
      const clone = h.cloneNode(true);
      page.appendChild(clone);
    });
    let textboxEl = null;
    group.forEach(item=>{
      if(item.type==='phrase'){
        if(!textboxEl){ textboxEl = document.createElement('div'); textboxEl.className='doc-box'; page.appendChild(textboxEl); }
        textboxEl.appendChild(item.el);
      } else {
        page.appendChild(item.el);
      }
    });
    if(footer) page.appendChild(footer.cloneNode(true));
    return page;
  });
  // "(segue)" sulle pagine di continuazione, per ripetere chiaramente il titolo pagina + nome impresa
  // (se il nome impresa è già presente nel titolo, es. "PRESCRIZIONI: <impresa>", non lo ripete)
  const impresaGiaNelTitolo = impresaNome && barLabelHtml.includes(esc(impresaNome));
  const segueSuffix = impresaGiaNelTitolo ? '' : ` — ${esc(impresaNome)}`;
  newPages.forEach((page,idx)=>{
    if(idx===0) return;
    const bar = page.querySelector('.doc-bar');
    if(bar) bar.innerHTML = `${barLabelHtml} <span class="sub">(segue)${segueSuffix}</span>`;
  });

  pageEl.replaceWith(...newPages);
}
function renumberDocPages(){
  const pages = [...document.querySelectorAll('#docview .doc-page')];
  const total = pages.length;
  pages.forEach((p,i)=>{
    const r = p.querySelector('.doc-footer .r');
    if(r) r.textContent = `Pagina ${i+1} di ${total}`;
  });
}
/* mostra #docview fuori schermo (per poterlo misurare/catturare), spezza le pagine osservanze troppo
   lunghe in max 3 pagine fisiche e rinumera tutte le pagine di conseguenza */
/* Fixed 794px capture width (== .doc-page's max-width, the A4-at-96dpi design width) so the
   PDF/export always renders at the intended proportions regardless of the actual browser/device
   viewport width — without this, on a narrow screen (e.g. iPhone) #docview had no explicit width
   and shrank to fit, breaking .doc-page's A4 aspect ratio and making html2canvas's page-height
   clamp in downloadPDF() squash content unevenly between pages. */
const DOC_CAPTURE_WIDTH = 794;

async function preparePaginatedDocview(){
  const docview = document.getElementById('docview');
  docview.style.display='block';
  docview.style.position='fixed'; docview.style.left='-10000px'; docview.style.top='0'; docview.style.zIndex='-1';
  docview.style.width=DOC_CAPTURE_WIDTH+'px';
  await new Promise(r=>setTimeout(r,60));
  docview.querySelectorAll('.doc-page[data-oss-page]').forEach(p=>paginateOsservanzePage(p,3));
  renumberDocPages();
}
function resetDocviewPosition(){
  const docview = document.getElementById('docview');
  docview.style.position=''; docview.style.left=''; docview.style.top=''; docview.style.zIndex=''; docview.style.width='';
}

/* ---- PDF export (client-side, html2canvas + jsPDF) ---- */
async function downloadPDF(){
  if(!window.jspdf || !window.html2canvas){ toast('Librerie PDF non disponibili, uso la stampa del browser.'); window.print(); return; }
  showSpinner('Genero il PDF…');
  try{
    await preparePaginatedDocview();
    const docview = document.getElementById('docview');
    const pages = docview.querySelectorAll('.doc-page');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    for(let i=0;i<pages.length;i++){
      const canvas = await html2canvas(pages[i], {scale:2, useCORS:true, backgroundColor:'#ffffff',
        windowWidth:DOC_CAPTURE_WIDTH, windowHeight:pages[i].offsetHeight});
      const imgData = canvas.toDataURL('image/jpeg',0.92);
      const imgW = pageW;
      const imgH = Math.min(canvas.height * imgW / canvas.width, pageH);
      if(i>0) pdf.addPage();
      pdf.addImage(imgData,'JPEG',0,0,imgW, imgH);
    }
    pdf.save(docFileBaseName(CURRENT_VERBALE)+'.pdf');
    docview.style.display='none'; resetDocviewPosition();
    toast('PDF scaricato');
  }catch(e){
    console.error(e); toast('Errore nella generazione del PDF, provo con la stampa.'); window.print();
  }finally{ hideSpinner(); }
}

/* ---- Word (.doc, HTML-based, editable in Word) export ---- */
function buildWordHTML(v){
  if(v.tipo==='riunione') return buildWordHTMLRiunione(v);
  const NAVY=DOC_NAVY, LINE='#d7dee6', BLUEBG='#eaf3fb';
  const pageStyle='mso-page-break-before:always;';
  const box = () => `border:1px solid #000;padding:10px 12px;margin-bottom:10px;`;
  const bar = (bg=NAVY) => `background:${bg};color:#fff;font-weight:bold;padding:7px 12px;margin:12px 0 10px;font-family:Arial,sans-serif;font-size:15px;`;
  const u = () => `border-bottom:1px solid #000;padding:0 4px;font-weight:bold;color:${NAVY};`;
  const totalPages = v.osservanze.length + 3;
  /* logo at native, unscaled size (208x88px) on every page, matching the source docx;
     on the cover page it is pulled further toward the physical top-left corner of the sheet */
  const logoImg = ()=>`<img src="${DOC_LOGO_SRC}" width="208" height="88" alt="Italgas Reti" style="display:block;margin:-55pt 0 14px -26pt;">`;
  const chk = (on,label)=>`<table style="margin:2px 0;"><tr>
      <td style="width:15px;font-size:13px;text-align:center;line-height:13px;font-family:Arial,sans-serif;">${on?'☒':'☐'}</td>
      <td style="padding-left:6px;font-size:12px;font-family:Arial,sans-serif;">${label}</td>
    </tr></table>`;
  const chkInline = (on,label)=>`<span style="display:inline-block;margin-right:16px;font-size:12px;font-family:Arial,sans-serif;">
      <span style="display:inline-block;font-size:13px;">${on?'☒':'☐'}</span> ${label}</span>`;
  /* fixed 4-row impresa schema (Impresa affidataria / esecutrice / in subappalto / Lavoratore autonomo in
     subappalto), matching the source docx exactly — see impresaFixedRows() for the same logic used on screen/PDF */
  const impresaFixedRowsWord = (imprese, selectedImpresaId) => IMPRESA_RUOLI.map(ruolo=>{
    const inRuolo = imprese.filter(ic=>ruoliOf(ic).includes(ruolo));
    const on = selectedImpresaId!=null ? inRuolo.some(ic=>ic.impresaId===selectedImpresaId) : inRuolo.length>0;
    const label = inRuolo.length
      ? `<b>${esc(ruolo)}:</b> <span style="${u()}">${esc(inRuolo.map(ic=>ic.nome).join(', '))}</span>`
      : `<b>${esc(ruolo)}:</b>`;
    return chk(on, label);
  }).join('');

  /* ---- page 1: cover — title text in Gill Sans MT / #007AC9, logo pulled toward the corner ---- */
  const COVER_FONT="'Gill Sans MT',Corbel,Calibri,Arial,sans-serif", COVER_BLUE='#007AC9';
  const page1 = `<div style="font-family:Arial,sans-serif;font-size:12px;">
    ${logoImg()}
    <div style="text-align:center;margin-top:50px;">
      <div style="color:${COVER_BLUE};font-family:${COVER_FONT};font-weight:bold;font-size:15px;">Allegato ${esc(DOC_ALLEGATO_NUM)}</div>
      <div style="color:${COVER_BLUE};font-family:${COVER_FONT};font-weight:bold;font-size:15px;text-transform:uppercase;margin:8px auto 22px;max-width:480px;line-height:1.4;">VERBALE VISITA IN CANTIERE DEL COORDINATORE PER L'ESECUZIONE DEI LAVORI</div>
      <div style="display:inline-block;border:1px solid ${COVER_BLUE};padding:10px 18px;color:${COVER_BLUE};font-family:${COVER_FONT};font-weight:bold;font-size:15px;">${esc([v.tipologiaLavoro, cantiereCoverLabel(v)].filter(Boolean).join(' ').toUpperCase())}</div>
    </div>
  </div>`;

  /* ---- page 2: visita ---- */
  const [dY,dM,dD] = (v.data||'').split('-');
  const impreseChkHtml = impresaFixedRowsWord(v.impreseCoinvolte);
  const presentiCols = presentiColonneHtmlWord(presentiNumeratiItems(v));
  /* foto fasi di lavoro: 4cm x 5,33cm fisse, 3 per riga (righe nuove ogni 3 foto — almeno 6 foto = 2 righe) */
  const fasiFotoHtml = (() => {
    if(!v.fotoFasi.length) return '';
    const cellHtml = p => `<td style="width:5.33cm;padding:4px;vertical-align:top;"><img src="${p.img}" style="width:5.33cm;height:4cm;object-fit:cover;"><br><span style="font-size:12px;color:#5b6b7c;">${esc(p.caption)}</span></td>`;
    let rows = '';
    for(let i=0;i<v.fotoFasi.length;i+=3){
      rows += `<tr>${v.fotoFasi.slice(i,i+3).map(cellHtml).join('')}</tr>`;
    }
    return `<table style="border-collapse:collapse;">${rows}</table>`;
  })();

  const page2 = `<div style="${pageStyle}font-family:Arial,sans-serif;font-size:12px;">
    ${logoImg()}
    <table width="100%" style="border:1px solid #000;border-collapse:collapse;margin-bottom:12px;"><tr>
      <td style="background:${NAVY};color:#fff;font-weight:800;font-style:italic;font-size:15px;padding:10px 20px;white-space:nowrap;">VISITA</td>
      <td style="padding:10px 14px;font-size:12px;">
        ${chkInline(true,'del')} <span style="${u()}">${esc(dD||'—')}</span> / <span style="${u()}">${esc(dM||'—')}</span> / <span style="${u()}">${esc(dY||'—')}</span>
        &nbsp;&nbsp;<b>n°</b> <span style="${u()}">${esc(String(v.numero))}</span> / <span style="${u()}">${esc(String(v.anno))}</span>
      </td>
    </tr></table>
    <div style="font-size:12px;margin-bottom:10px;border:1px solid #000;padding:8px 10px;"><b>Cantiere di:</b> <span style="${u()}">${esc(cantiereCittaProv(v))}</span> &nbsp;&nbsp; <b>Sito in:</b> <span style="${u()}">${esc(v.sito)}</span></div>
    <table width="100%" style="border-collapse:collapse;border:1px solid #000;margin-bottom:6px;">
      <tr><td colspan="3" style="background:${NAVY};color:#fff;font-weight:bold;padding:3px 10px;font-size:15px;">ATTIVITA'</td></tr>
      <tr><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;width:70%;">Arrivo in cantiere ed inizio sopralluogo</td><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;text-align:center;">h</td><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;background:${BLUEBG};color:${NAVY};font-weight:bold;text-align:center;">${v.oraArrivoCantiere||'—'}</td></tr>
      <tr><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;">Fine sopralluogo e partenza per la sede aziendale</td><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;text-align:center;">h</td><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;background:${BLUEBG};color:${NAVY};font-weight:bold;text-align:center;">${v.oraFineSopralluogo||'—'}</td></tr>
      <tr><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;">Arrivo in sede aziendale</td><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;text-align:center;">h</td><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;background:${BLUEBG};color:${NAVY};font-weight:bold;text-align:center;">${v.oraArrivoSede||'—'}</td></tr>
      <tr><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;">In data ${fmtDate(v.data)}: redazione verbale di sopralluogo</td><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;text-align:center;">h</td><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;background:${BLUEBG};color:${NAVY};font-weight:bold;text-align:center;">${v.oraRedazione||'—'}</td></tr>
      <tr><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;font-weight:bold;">Per complessive</td><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;text-align:center;">h</td><td style="border:1px solid #000;padding:1.5px 9px;font-size:12px;background:${BLUEBG};color:${NAVY};font-weight:bold;text-align:center;">${totalHours(v)||'—'}</td></tr>
    </table>
    <div style="${box()}">
      <table width="100%" style="margin-bottom:6px;"><tr>
        <td style="width:50%;font-size:12px;"><b>Committente:</b> <span style="${u()}">${esc(v.committente)||'—'}</span></td>
        <td style="width:50%;font-size:12px;"><b>Responsabile Lavori:</b> <span style="${u()}">${esc(v.responsabileLavori)||'—'}</span></td>
      </tr></table>
      ${impreseChkHtml}
    </div>
    <div style="font-size:12px;line-height:1.5;${box()}"><b>Presenti al momento del sopralluogo</b><br>${presentiCols||'—'}<br><br><b>il CSE</b> <span style="${u()}">${esc(v.cse)||'—'}</span></div>
    ${v.fotoFasi.length ? `<div style="${bar()}">Fasi di lavoro in atto</div>${fasiFotoHtml}` : ''}
  </div>`;

  /* ---- osservanze: TRE pagine dedicate per impresa (NOTE / OSSERVANZE / PRESCRIZIONI) ---- */
  const ossPages = v.osservanze.map(o=>{
    const impresa = v.impreseCoinvolte.find(i=>i.impresaId===o.impresaId);
    const impresaNome = esc(impresa?impresa.nome:'');
    const phraseHtml = (ids, list) => list.filter(f=>ids.includes(f.id)).map(f=>`<div style="padding:5px 0;border-top:1px solid #eee;font-size:12px;line-height:1.45;">${esc(f.testo)}</div>`).join('');
    const stdHtml = phraseHtml(o.selFrasi, DB.frasi.filter(f=>f.categoria==='standard'));
    const daAggHtml = phraseHtml(o.selFrasi, DB.frasi.filter(f=>f.categoria==='daAggiungere'));
    const noteSpecHtml = phraseHtml(o.selFrasi, DB.frasi.filter(f=>f.categoria==='noteSpecifiche'));
    const prescrHtml = phraseHtml(o.selPrescrizioni, DB.frasi.filter(f=>f.categoria==='prescrizioni'));
    const fotoCellHtml = p => `<td style="width:5.33cm;padding:4px;vertical-align:top;"><img src="${p.img}" style="width:5.33cm;height:4cm;object-fit:cover;"><br><span style="font-size:12px;color:#5b6b7c;">${esc(p.caption)}</span></td>`;
    let fotoHtml = '';
    if(o.foto.length){
      let fotoRows = '';
      for(let i=0;i<o.foto.length;i+=3){ fotoRows += `<tr>${o.foto.slice(i,i+3).map(fotoCellHtml).join('')}</tr>`; }
      fotoHtml = `<table style="border-collapse:collapse;margin-bottom:8px;">${fotoRows}</table>`;
    }
    const targetChk = impresaFixedRowsWord(v.impreseCoinvolte, o.impresaId);
    const noteBody = stdHtml+(o.noteLibere?`<div style="padding:5px 0;border-top:1px solid #eee;font-size:12px;line-height:1.45;">${esc(o.noteLibere)}</div>`:'');
    /* Note specifiche CSE + foto: riquadro proprio (stessa richiesta 09/09/2026 applicata al PDF
       sopra), mostrato solo quando c'è davvero qualcosa da racchiudere. */
    const noteSpecContent = noteSpecHtml+(o.noteSpecificheLibere?`<div style="padding:5px 0;border-top:1px solid #eee;font-size:12px;line-height:1.45;">${esc(o.noteSpecificheLibere)}</div>`:'');
    const noteSpecBoxHtml = (noteSpecContent || o.foto.length) ? `<div style="${box()}">${noteSpecContent}${fotoHtml}</div>` : '';
    const prescrBody = prescrHtml+(o.prescrizioniLibere?`<div style="padding:5px 0;border-top:1px solid #eee;font-size:12px;line-height:1.45;">${esc(o.prescrizioniLibere)}</div>`:'');
    const dedicatedPage = (barLabel, body, extraHtml) => `<div style="${pageStyle}font-family:Arial,sans-serif;font-size:12px;">
      ${logoImg()}
      <div style="${bar()}">${barLabel}</div>
      <div style="${box()}">${targetChk}</div>
      <div style="${box()}">${body || '<div style="font-size:12px;">—</div>'}</div>
      ${extraHtml||''}
    </div>`;
    return dedicatedPage('NOTE', noteBody, '')
      + dedicatedPage('OSSERVANZE', daAggHtml, noteSpecBoxHtml)
      + dedicatedPage(`PRESCRIZIONI: ${impresaNome}`, prescrBody, '');
  }).join('');

  /* ---- sospensione: always present ---- */
  const s = v.sospensione;
  const susContro = IMPRESA_RUOLI.map(r=>chk(s.contro.includes(r), r)).join('');
  const susEsitoHtml =
    s.esito==='approva' ? chk(true,'Il CSE approva') + chk(false,'Il CSE approva con le seguenti prescrizioni') + chk(false,'Il CSE respinge la proposta')
    : s.esito==='approvaConPrescrizioni' ? chk(false,'Il CSE approva') + chk(true,'Il CSE approva con le seguenti prescrizioni: '+(esc(s.prescrizioniTesto)||'—')) + chk(false,'Il CSE respinge la proposta')
    : s.esito==='respinge' ? chk(false,'Il CSE approva') + chk(false,'Il CSE approva con le seguenti prescrizioni') + chk(true,'Il CSE respinge la proposta per i seguenti motivi: '+(esc(s.motivoRespinta)||'—')+(s.entroData?` — nuova proposta entro il ${fmtDate(s.entroData)}`:''))
    : chk(false,'Il CSE approva') + chk(false,'Il CSE approva con le seguenti prescrizioni') + chk(false,'Il CSE respinge la proposta');
  const naStamp = !s.attiva ? `<p style="text-align:center;color:#666;font-weight:bold;font-size:12px;border:1px solid #666;padding:6px;margin:10px 0;">— NON APPLICABILE ALLA PRESENTE VISITA —</p>` : '';
  const photoTableWord = (list) => (list&&list.length) ? (()=>{
    let rows = '';
    for(let i=0;i<list.length;i+=3){
      rows += `<tr>${list.slice(i,i+3).map(p=>`<td style="width:5.33cm;padding:4px;vertical-align:top;"><img src="${p.img}" style="width:5.33cm;height:4cm;object-fit:cover;"><br><span style="font-size:12px;color:#5b6b7c;">${esc(p.caption)}</span></td>`).join('')}</tr>`;
    }
    return `<table style="border-collapse:collapse;margin:8px 0;">${rows}</table>`;
  })() : '';

    const destinatariRows = DB.destinatari.filter(d=>v.destinatariSelezionati.includes(d.id))
    .map(d=>chk(true, `Sig. <span style="${u()}">${esc(d.nome)}</span>${d.ruolo?' - '+esc(d.ruolo):''}${d.email?' &nbsp; e-mail '+esc(d.email):''}`)).join('') || '<p style="font-size:12px;color:#5b6b7c;">Nessun destinatario selezionato.</p>';
  const invioHtml = chkInline(v.modalitaInvio.email,'e-mail') + chkInline(v.modalitaInvio.fax,'via fax') + chkInline(v.modalitaInvio.brevimano,'via WhatsApp / app');

  const sigLine = (role,name,img)=>`<table width="100%" style="margin-top:22px;"><tr><td align="right">
    <span style="font-size:12px;color:#333;">${esc(role)}</span><br>
    ${img?`<img src="${img}" style="max-height:50px;max-width:220px;display:block;margin:4px 0 -6px auto;"><br>`:''}
    <span style="display:inline-block;min-width:220px;border-bottom:1px solid #000;height:24px;"></span><br>
    <span style="font-size:12px;font-weight:bold;color:${NAVY};">${esc(name)||'&nbsp;'}</span></td></tr></table>`;
  let firme = sigLine('Il coordinatore della sicurezza in fase di esecuzione', v.cse, v.firmaCSEImg);
  if(v.assistenteCSE) firme += sigLine('Assistente CSE', v.assistenteCSE, v.assistenteCSEImg);
  v.impreseCoinvolte.forEach(i=> firme += sigLine('Preposto — '+i.nome, i.preposto, i.firmaPrepostoImg));
  if(v.firmaExtra && v.firmaExtra.nome) firme += sigLine(v.firmaExtra.label||'Altra firma', v.firmaExtra.nome, v.firmaExtra.img);

  /* ---- sospensione + firme/distribuzione: condivise sulla stessa pagina finale ---- */
  const suspAndFirmeBlock = `<div style="${pageStyle}font-family:Arial,sans-serif;font-size:12px;">
      ${logoImg()}
      <div style="${bar()}margin-bottom:0;">SOSPENSIONE DEI LAVORI per pericolo grave, imminente e direttamente riscontrato</div>
      <div style="border:1px solid #000;border-top:none;padding:10px 12px;">
        ${naStamp}
        <p style="font-size:12px;margin:6px 0;"><b>nei confronti di:</b></p>
        ${susContro}
        <p style="font-size:12px;margin:10px 0 4px;"><b>A) Descrizione sintetica della fase/sottofase sospesa e motivazione:</b></p>
        <p style="font-size:12px;">${esc(s.descrizione)||'—'}</p>
        ${photoTableWord(s.fotoFase)}
        <p style="font-size:12px;margin:10px 0 4px;"><b>Proposta di intervento per il ripristino in sicurezza:</b></p>
        <p style="font-size:12px;">${esc(s.propostaTesto)||'—'}</p>
        <p style="font-size:12px;margin:10px 0 4px;"><b>Esito CSE:</b></p>
        ${susEsitoHtml}
        <p style="font-size:12px;margin:12px 0 4px;"><b>Esito della verifica degli avvenuti adeguamenti:</b></p>
        ${chk(s.verificaAvvenuta, "il pericolo grave, imminente e direttamente riscontrato è stato eliminato")}
        ${photoTableWord(s.fotoRipristino)}
      </div>

  /* ---- firme + distribuzione (sulla stessa pagina della sospensione, invece che su una pagina a parte) ---- */
      <div style="${bar()}line-height:1.4;margin-top:16px;">Quanto contenuto nel presente rapporto costituisce adempimento degli obblighi dell'art. 92, comma 1, e aggiornamento del PSC e dei POS delle imprese affidataria ed esecutrici.</div>
      ${firme}
      <p style="font-size:12px;margin-top:22px;">Il presente verbale è composto da <span style="${u()}">${totalPages}</span> pagine e viene inviato via ${invioHtml} a:</p>
      ${destinatariRows}
      ${chk(v.rimaneCantiere, 'Rimane in cantiere a disposizione degli Enti di Vigilanza (in formato digitale)')}
    </div>`;

  /* real, repeating Word footer (mso-element:footer + @page mso-footer) instead of a table placed after
     each page's content — this is what actually guarantees the footer sits at the bottom of every printed
     page in Word (and stays correct if the document is later edited), using Word's own PAGE/NUMPAGES fields.
     Page margins below are the exact values measured from the source docx's sectPr/pgMar. */
  const mkField = (code, fallback) => `<!--[if supportFields]><span style='mso-element:field-begin'></span><span style='mso-spacerun:yes'>&nbsp;</span>${code}<span style='mso-element:field-separator'></span><![endif]-->${fallback}<!--[if supportFields]><span style='mso-element:field-end'></span><![endif]-->`;
  const footerDiv = `<div style='mso-element:footer;' id="f1">
    <table width="100%" style="border-collapse:collapse;margin:0;"><tr>
      <td style="border-top:1px solid ${LINE};padding-top:4pt;font-family:'Gill Sans MT',Corbel,Arial,sans-serif;font-size:9pt;color:#000;">${DOC_ITG_CODE}<br>${DOC_ALLEGATO_CODE}</td>
      <td align="right" style="border-top:1px solid ${LINE};padding-top:4pt;font-family:'Gill Sans MT',Corbel,Arial,sans-serif;font-size:9pt;color:#000;vertical-align:bottom;">Pagina ${mkField('PAGE','1')} di ${mkField('NUMPAGES', String(totalPages))}</td>
    </tr></table>
  </div>`;

  return `<!DOCTYPE html><html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset="utf-8"><title>${esc(docFileBaseName(v))}</title>
  <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->
  <style>
    @page Section1 {size:595.3pt 841.9pt;margin:72pt 56.2pt 14pt 46pt;mso-header-margin:36pt;mso-footer-margin:14pt;mso-footer:f1;mso-paper-source:0;}
    div.Section1 {page:Section1;}
  </style>
  </head><body>${footerDiv}<div class="Section1">${page1}${page2}${ossPages}${suspAndFirmeBlock}</div></body></html>`;
}

/* Word (.doc) del verbale di riunione iniziale (Allegato 8) — stessa tecnica di buildWordHTML() sopra
   (tabelle/stili inline compatibili Word, footer ripetuto via mso-element:footer), 4 pagine fisse
   invece della paginazione per foto/osservanze, che questo tipo di verbale non ha. */
function buildWordHTMLRiunione(v){
  const NAVY=DOC_NAVY, LINE='#d7dee6';
  const pageStyle='mso-page-break-before:always;';
  const box = () => `border:1px solid #000;padding:10px 12px;margin-bottom:10px;`;
  const bar = (bg=NAVY) => `background:${bg};color:#fff;font-weight:bold;padding:7px 12px;margin:12px 0 10px;font-family:Arial,sans-serif;font-size:15px;`;
  const u = () => `border-bottom:1px solid #000;padding:0 4px;font-weight:bold;color:${NAVY};`;
  const totalPages = 5;
  const logoImg = ()=>`<img src="${DOC_LOGO_SRC}" width="208" height="88" alt="Italgas Reti" style="display:block;margin:-55pt 0 14px -26pt;">`;
  const chk = (on,label)=>`<table style="margin:2px 0;"><tr>
      <td style="width:15px;font-size:13px;text-align:center;line-height:13px;font-family:Arial,sans-serif;">${on?'☒':'☐'}</td>
      <td style="padding-left:6px;font-size:12px;font-family:Arial,sans-serif;">${label}</td>
    </tr></table>`;
  const chkInline = (on,label)=>`<span style="display:inline-block;margin-right:16px;font-size:12px;font-family:Arial,sans-serif;">
      <span style="display:inline-block;font-size:13px;">${on?'☒':'☐'}</span> ${label}</span>`;
  const impresaFixedRowsWord = (imprese, selectedImpresaId) => IMPRESA_RUOLI.map(ruolo=>{
    const inRuolo = imprese.filter(ic=>ruoliOf(ic).includes(ruolo));
    const on = selectedImpresaId!=null ? inRuolo.some(ic=>ic.impresaId===selectedImpresaId) : inRuolo.length>0;
    const label = inRuolo.length
      ? `<b>${esc(ruolo)}:</b> <span style="${u()}">${esc(inRuolo.map(ic=>ic.nome).join(', '))}</span>`
      : `<b>${esc(ruolo)}:</b>`;
    return chk(on, label);
  }).join('');
  const referentiRowsWord = (imprese) => IMPRESA_RUOLI.map(ruolo=>{
    const inRuolo = imprese.filter(ic=>ruoliOf(ic).includes(ruolo));
    if(!inRuolo.length) return chk(false, `<b>${esc(ruolo)}:</b>`);
    return inRuolo.map(ic=>{
      const label = ic.presente===false
        ? `<b>${esc(ruolo)}:</b> <span style="${u()}">${esc(ic.nome)}</span> (non presente a questa riunione)`
        : `<b>${esc(ruolo)}:</b> <span style="${u()}">${esc(ic.nome)}</span> nella persona di <span style="${u()}">${esc(ic.referenteNome)||'—'}</span> avente mansioni di <span style="${u()}">${esc(ic.referenteMansione)||'—'}</span>`;
      return chk(true, label);
    }).join('');
  }).join('');
  const sigLine = (role,name,img)=>`<table width="100%" style="margin-top:22px;"><tr><td align="right">
    <span style="font-size:12px;color:#333;">${esc(role)}</span><br>
    ${img?`<img src="${img}" style="max-height:50px;max-width:220px;display:block;margin:4px 0 -6px auto;"><br>`:''}
    <span style="display:inline-block;min-width:220px;border-bottom:1px solid #000;height:24px;"></span><br>
    <span style="font-size:12px;font-weight:bold;color:${NAVY};">${esc(name)||'&nbsp;'}</span></td></tr></table>`;

  /* ---- pagina 1: copertina ---- */
  const COVER_FONT="'Gill Sans MT',Corbel,Calibri,Arial,sans-serif", COVER_BLUE='#007AC9';
  const page1 = `<div style="font-family:Arial,sans-serif;font-size:12px;">
    ${logoImg()}
    <div style="text-align:center;margin-top:50px;">
      <div style="color:${COVER_BLUE};font-family:${COVER_FONT};font-weight:bold;font-size:15px;">Allegato ${esc(DOC_ALLEGATO_NUM_RIUNIONE)}</div>
      <div style="color:${COVER_BLUE};font-family:${COVER_FONT};font-weight:bold;font-size:15px;text-transform:uppercase;margin:8px auto 22px;max-width:480px;line-height:1.4;">VERBALE RIUNIONE INIZIALE DI COORDINAMENTO</div>
      <div style="display:inline-block;border:1px solid ${COVER_BLUE};padding:10px 18px;color:${COVER_BLUE};font-family:${COVER_FONT};font-weight:bold;font-size:15px;">${esc([v.tipologiaLavoro, cantiereCoverLabel(v)].filter(Boolean).join(' ').toUpperCase())}</div>
    </div>
  </div>`;

  /* ---- pagina 2: dati riunione, imprese/referenti, presenti, ordine del giorno ---- */
  const [dY,dM,dD] = (v.data||'').split('-');
  const presentiCols = presentiColonneHtmlWord(presentiNumeratiItems(v));
  const og = v.ordineGiorno;
  const page2 = `<div style="${pageStyle}font-family:Arial,sans-serif;font-size:12px;">
    ${logoImg()}
    <table width="100%" style="border:1px solid #000;border-collapse:collapse;margin-bottom:12px;"><tr>

  return `<!DOCTYPE html><html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>

function downloadWord(){
  showSpinner('Genero il file Word…');
  try{
    const html = buildWordHTML(CURRENT_VERBALE);
    const blob = new Blob(['\ufeff', html], {type:'application/msword'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = docFileBaseName(CURRENT_VERBALE)+'.doc';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('File Word scaricato');
  }catch(e){ console.error(e); toast('Errore nella generazione del file Word.'); }
  finally{ hideSpinner(); }
}

/* ---- scarica una firma salvata (disegnata o caricata da foto) come file PNG a se' stante, per
   poterla riutilizzare fuori dall'app — richiesta 24/09/2026, commento sull'Artifact ("permetti di
   esportare le firme in png senza sfondo"). Le firme disegnate sono gia' PNG con sfondo trasparente;
   quelle caricate da foto vengono elaborate da processFirmaImage() (vedi sopra, presso
   resizeImage()) per rimuovere lo sfondo chiaro prima di essere salvate nel verbale. ---- */
async function downloadFirmaPng(dataUrl, filenameBase){
  try{
    const blob = await (await fetch(dataUrl)).blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filenameBase + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('Firma scaricata');
  }catch(e){ console.error(e); toast('Errore nel download della firma.'); }
}

function attachHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click', async ()=>{
    const g = el.dataset.go;
    if(g==='new-verbale'){
      const cantieriAttivi = DB.cantieri.filter(c=>!c.completato);
      if(cantieriAttivi.length===0){
        toast(DB.cantieri.length===0 ? 'Crea prima un cantiere.' : 'Tutti i cantieri sono completati: riattivane uno o creane uno nuovo.');
        go({name:'cantieri'}); return;
      }
      CURRENT_VERBALE = blankVerbale(cantieriAttivi[0]);
      go({name:'wizard', step:'cantiere'});
    } else if(g==='new-verbale-riunione'){
      const cantieriAttivi = DB.cantieri.filter(c=>!c.completato);
      if(cantieriAttivi.length===0){
        toast(DB.cantieri.length===0 ? 'Crea prima un cantiere.' : 'Tutti i cantieri sono completati: riattivane uno o creane uno nuovo.');
        go({name:'cantieri'}); return;
      }
      CURRENT_VERBALE = blankVerbaleRiunione(cantieriAttivi[0]);
      go({name:'wizard', step:'cantiere'});
    } else if(g==='cantiere-edit-new'){ go({name:'cantiere-edit', id:null}); }
    else if(g==='impresa-edit-new'){ go({name:'impresa-edit', id:null}); }
    else if(g==='personale-edit-new'){ go({name:'personale-edit', id:null}); }
    else if(g==='destinatario-edit-new'){ go({name:'destinatario-edit', id:null}); }
    else if(g==='home-confirm'){
      if(confirm('Uscire dalla compilazione? Puoi salvare come bozza dall\'anteprima.')) go({name:'home'});
    }
    else go({name:g});
  }));

  app.querySelectorAll('[data-edit-cantiere]').forEach(el=>el.addEventListener('click', ()=>go({name:'cantiere-edit', id:el.dataset.editCantiere})));
  app.querySelectorAll('[data-del-cantiere]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.dataset.delCantiere;
    const c = DB.cantieri.find(x=>x.id===id);
    confirmEliminaConTesto(`Eliminare il cantiere "${c?c.nome:''}"? Resterà nel Cestino per ${CESTINO_GIORNI_RITENZIONE} giorni, poi verrà rimosso per sempre.`, async ()=>{
      if(c) await spostaInCestino('cantiere', c.nome, c.sito||'', c);
      DB.cantieri = DB.cantieri.filter(x=>x.id!==id);
      await sset(KEYS.cantieri, DB.cantieri); toast('Cantiere spostato nel Cestino'); render();
    });
  }));
  // Cantieri completati (richiesta 23/09/2026): sposta il cantiere fuori/dentro l'elenco attivo senza
  // eliminarlo — resta nei dati (verbali già fatti, esportazioni, filtro dell'archivio verbali) ma
  // esce dal menù di scelta cantiere per un nuovo verbale. Il pulsante ✅ dall'elenco attivo chiede
  // ora di digitare "confermato" (richiesta 23/09/2026, "anche qua serve la conferma con scritto
  // 'confermato'"), per evitare tocchi accidentali su un'icona in mezzo all'elenco; resta invece un
  // singolo tocco, senza conferma, la riattivazione (↩️) e il pulsante nella scheda di modifica.
  app.querySelectorAll('[data-complete-cantiere]').forEach(el=>el.addEventListener('click', ()=>{
    const c = DB.cantieri.find(x=>x.id===el.dataset.completeCantiere);
    if(!c) return;
    confirmConParola(`Segnare il cantiere "${c.nome}" come completato? Uscirà dall'elenco attivo e non sarà più selezionabile per nuovi verbali (resterà comunque riattivabile in qualsiasi momento da "Cantieri completati").`, 'confermato', async ()=>{
      c.completato = true; c.completatoIl = todayISO();
      await sset(KEYS.cantieri, DB.cantieri); toast('Cantiere segnato come completato'); render();
    }, {labelBtn:'Conferma', btnClass:'btn'});
  }));
  app.querySelectorAll('[data-reactivate-cantiere]').forEach(el=>el.addEventListener('click', async ()=>{
    const c = DB.cantieri.find(x=>x.id===el.dataset.reactivateCantiere);
    if(!c) return;
    c.completato = false; c.completatoIl = null;
    await sset(KEYS.cantieri, DB.cantieri); toast('Cantiere riattivato'); render();
  }));
  const toggleCompletatoBtn = app.querySelector('[data-toggle-completato-cantiere]');
  if(toggleCompletatoBtn) toggleCompletatoBtn.addEventListener('click', async ()=>{
    const c = DB.cantieri.find(x=>x.id===toggleCompletatoBtn.dataset.toggleCompletatoCantiere);
    if(!c) return;
    c.completato = !c.completato; c.completatoIl = c.completato ? todayISO() : null;
    await sset(KEYS.cantieri, DB.cantieri);
    toast(c.completato ? 'Cantiere segnato come completato' : 'Cantiere riattivato');
    go({name: c.completato ? 'cantieriCompletati' : 'cantieri'});

  // Cestino (richiesta 23/09/2026)
  app.querySelectorAll('[data-restore-cestino]').forEach(el=>el.addEventListener('click', ()=>{
    ripristinaDaCestino(el.dataset.restoreCestino);
  }));
  app.querySelectorAll('[data-del-cestino]').forEach(el=>el.addEventListener('click', ()=>{

  const saveCantiereBtn = app.querySelector('[data-save-cantiere]');

    await sset(KEYS.imprese, DB.imprese); await sset(KEYS.personale, DB.personale);

  // Rappresentanti per la sicurezza (RLS/RLST) — stesso meccanismo tendina+Altro, per scegliere
  // l'impresa (affidataria/esecutrice) a cui si riferisce ciascuna riga (richiesta 24/09/2026).
  app.querySelectorAll('[data-rls-impresa-select]').forEach(el=>el.addEventListener('change', ()=>{
    const idx = +el.dataset.rlsImpresaSelect;
    const r = CURRENT_VERBALE.rls[idx];
    if(!r) return;
    r.impresaAltro = (el.value==='__altro__');
    r.impresaNome = (el.value==='__altro__') ? '' : el.value;
    // salvo prima il resto del passaggio (es. il "Nome e cognome" ancora solo nel DOM sulle altre
    // righe) cosi' il render() qui sotto non lo perde — stesso fix gia' applicato sopra al vdoc-select.
    persistWizardFields('rls');
    render();
  }));
  app.querySelectorAll('[data-rls-impresa-text]').forEach(el=>el.addEventListener('input', ()=>{
    const idx = +el.dataset.rlsImpresaText;
    const r = CURRENT_VERBALE.rls[idx];
    if(r) r.impresaNome = el.value;
  }));

  // firma grafica — disegno a mano libera (pointer events: dito/mouse/pen) o immagine caricata.
  // Il riquadro resta "spento" (tocco = scorrimento normale della pagina) finché non lo si tocca
  // esplicitamente sulla scritta "Tocca qui per iniziare a firmare": solo da quel momento in poi
  // il tocco disegna la firma, per evitare di firmare per sbaglio scorrendo la pagina col dito
  // proprio sopra il riquadro (richiesta 09/09/2026, commento sull'Artifact).
  app.querySelectorAll('[data-sig-overlay]').forEach(overlay=>overlay.addEventListener('click', ()=>{
    const canvas = app.querySelector(`[data-sig-canvas="${overlay.dataset.sigOverlay}"]`);
    if(canvas) canvas._armed = true;
    overlay.style.display = 'none';
  }));
  app.querySelectorAll('[data-sig-canvas]').forEach(canvas=>{
    const ctx = canvas.getContext('2d');
    ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
    canvas._hasDrawing = false;
    canvas._armed = false;
    let drawing = false, lastX = 0, lastY = 0;
    const posFromEvent = e => {
      const r = canvas.getBoundingClientRect();
      const sx = canvas.width / r.width, sy = canvas.height / r.height;
      return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
    };
    canvas.addEventListener('pointerdown', e => {
      if(!canvas._armed) return; // riquadro non ancora attivato col tocco sulla scritta: ignora
      drawing = true; canvas.setPointerCapture(e.pointerId);
      const p = posFromEvent(e); lastX = p.x; lastY = p.y;
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', e => {
      if(!drawing) return;
      const p = posFromEvent(e);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
      lastX = p.x; lastY = p.y; canvas._hasDrawing = true;
    });
    const stopDrawing = () => { drawing = false; };
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointerleave', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);
  });
  app.querySelectorAll('[data-sig-erase]').forEach(btn=>btn.addEventListener('click', ()=>{
    const canvas = app.querySelector(`[data-sig-canvas="${btn.dataset.sigErase}"]`);
    if(canvas){ canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height); canvas._hasDrawing = false; }
  }));
  app.querySelectorAll('[data-sig-save]').forEach(btn=>btn.addEventListener('click', ()=>{
    const key = btn.dataset.sigSave;
    const canvas = app.querySelector(`[data-sig-canvas="${key}"]`);
    if(!canvas || !canvas._hasDrawing){ toast('Disegna prima la firma nel riquadro.'); return; }
    setFirmaImg(CURRENT_VERBALE, key, canvas.toDataURL('image/png'));
    toast('Firma salvata'); render();
  }));
  app.querySelectorAll('[data-sig-redo]').forEach(btn=>btn.addEventListener('click', ()=>{
    setFirmaImg(CURRENT_VERBALE, btn.dataset.sigRedo, null); render();
  }));
  app.querySelectorAll('[data-sig-file]').forEach(inp=>inp.addEventListener('change', e=>{
    const key = inp.dataset.sigFile;
    const file = e.target.files[0];
    if(!file) return;
    // processFirmaImage() (non resizeImage()): esporta in PNG e rimuove lo sfondo chiaro, cosi' una
    // firma caricata da foto si sovrappone bene al documento — vedi nota sopra la funzione.
    processFirmaImage(file, dataUrl=>{ setFirmaImg(CURRENT_VERBALE, key, dataUrl); toast('Firma caricata'); render(); });
  }));
  // scarica la firma salvata (disegnata o caricata) come file PNG a se' stante, per riusarla fuori
  // dall'app — richiesta 24/09/2026, commento sull'Artifact.
  app.querySelectorAll('[data-sig-download]').forEach(btn=>btn.addEventListener('click', ()=>{
    const wrap = btn.closest('.sig-pad-wrap');
    const img = wrap ? wrap.querySelector('.sig-preview img') : null;
    if(!img || !img.src){ toast('Nessuna firma da scaricare.'); return; }
    downloadFirmaPng(img.src, btn.dataset.sigFilename || 'Firma');
  }));

  // destinatari
  app.querySelectorAll('[data-modo]').forEach(el=>el.addEventListener('click', ()=>{
    const k = el.dataset.modo; CURRENT_VERBALE.modalitaInvio[k] = !CURRENT_VERBALE.modalitaInvio[k]; render();
  }));
  app.querySelectorAll('[data-dest-check]').forEach(el=>el.addEventListener('change', ()=>{
    const id = el.dataset.destCheck; const arr = CURRENT_VERBALE.destinatariSelezionati;
    const i = arr.indexOf(id); if(el.checked && i<0) arr.push(id); if(!el.checked && i>=0) arr.splice(i,1);
  }));
  const rimaneToggle = document.getElementById('w-rimane');
  if(rimaneToggle) rimaneToggle.addEventListener('change', ()=>{ CURRENT_VERBALE.rimaneCantiere = rimaneToggle.checked; });

  // pulsante "💾 Bozza" nell'intestazione, presente in ogni passaggio del wizard: salva lo stato
  // attuale del verbale (compreso quanto scritto nel passaggio corrente) senza uscire dalla compilazione,
  // cosi' il lavoro non si perde se l'app viene chiusa o il dispositivo va in errore a meta' compilazione.
  const saveBozzaWizard = app.querySelector('[data-save-bozza-wizard]');
  if(saveBozzaWizard) saveBozzaWizard.addEventListener('click', async ()=>{
    if(!CURRENT_VERBALE) return;
    persistWizardFields(ROUTE.step);
    CURRENT_VERBALE.stato = 'bozza';
    await saveVerbale(CURRENT_VERBALE);
    toast('Bozza salvata');
  });

  // anteprima actions
  const saveBozza = app.querySelector('[data-save-bozza]');
  if(saveBozza) saveBozza.addEventListener('click', async ()=>{
    CURRENT_VERBALE.stato='bozza'; await saveVerbale(CURRENT_VERBALE); toast('Bozza salvata'); go({name:'archivio'});
  });
  const generaBtn = app.querySelector('[data-genera]');
  if(generaBtn) generaBtn.addEventListener('click', async ()=>{
    CURRENT_VERBALE.stato='finale'; await saveVerbale(CURRENT_VERBALE); go({name:'documento'});
  });

  const printBtn = app.querySelector('[data-print]');
  if(printBtn) printBtn.addEventListener('click', async ()=>{
    await preparePaginatedDocview();
    resetDocviewPosition();
    window.print();
    document.getElementById('docview').style.display='none';
  });
  const pdfBtn = app.querySelector('[data-download-pdf]');
  if(pdfBtn) pdfBtn.addEventListener('click', downloadPDF);
  const wordBtn = app.querySelector('[data-download-word]');
  if(wordBtn) wordBtn.addEventListener('click', downloadWord);
}

function persistWizardFields(step){
  const v = CURRENT_VERBALE; if(!v) return;
  const g = id => document.getElementById(id);
  if(step==='cantiere'){
    const sel = g('w-cantiere');
    if(sel && sel.value){
      const c = DB.cantieri.find(x=>x.id===sel.value);
      if(c){ v.cantiereId=c.id; v.cantiereNome=c.nome; }
    }
    if(g('w-sito')) v.sito = g('w-sito').value;
    if(g('w-committente')) v.committente = g('w-committente').value;
    if(g('w-rl')) v.responsabileLavori = g('w-rl').value;
    if(g('w-numero')) v.numero = +g('w-numero').value || v.numero;
    if(g('w-anno')) v.anno = +g('w-anno').value || v.anno;
    if(g('w-data')) v.data = g('w-data').value;
    if(g('w-cse')) v.cse = g('w-cse').value;
  } else if(step==='orari'){
    ['oraArrivoCantiere','oraFineSopralluogo','oraArrivoSede','oraRedazione'].forEach(k=>{
      const el=g('w-'+k); if(el) v[k]=el.value;
    });
  } else if(step==='fasi'){
    if(g('w-fasi')) v.fasiLavoro = g('w-fasi').value;
  } else if(step==='osservanze'){
    const active = ROUTE.osservanzaImpresaId || (v.impreseCoinvolte[0] && v.impreseCoinvolte[0].impresaId);
    const oss = v.osservanze.find(o=>o.impresaId===active);
    if(oss){
      const noteEl = g('w-oss-note'); if(noteEl) oss.noteLibere = noteEl.value;
      const notespecEl = g('w-oss-notespec'); if(notespecEl) oss.noteSpecificheLibere = notespecEl.value;
      const prescrEl = g('w-oss-prescr'); if(prescrEl) oss.prescrizioniLibere = prescrEl.value;
    }
  } else if(step==='sospensione'){
    const s = v.sospensione;
    if(g('w-susp-descr')) s.descrizione = g('w-susp-descr').value;
    if(g('w-susp-proposta')) s.propostaTesto = g('w-susp-proposta').value;
    if(g('w-susp-prescr')) s.prescrizioniTesto = g('w-susp-prescr').value;
    if(g('w-susp-motivo')) s.motivoRespinta = g('w-susp-motivo').value;
    if(g('w-susp-entro')) s.entroData = g('w-susp-entro').value;
  } else if(step==='firme'){
    if(g('w-cse-firma')) v.cse = g('w-cse-firma').value;
    if(g('w-assistente-cse')) v.assistenteCSE = g('w-assistente-cse').value;
    v.impreseCoinvolte.forEach((ic,idx)=>{ const el=g(''); }); // placeholder no-op (live-bound above)
    if(g('w-extra-label')) v.firmaExtra.label = g('w-extra-label').value;
    if(g('w-extra-nome')) v.firmaExtra.nome = g('w-extra-nome').value;
  } else if(step==='incontro'){
    // passaggio proprio del verbale di riunione (Allegato 8) — vedi wizIncontro()
    if(g('w-luogo-altro')) v.luogoAltro = g('w-luogo-altro').value;
    if(g('w-ora-inizio')) v.oraInizio = g('w-ora-inizio').value;
    if(g('w-ora-fine')) v.oraFine = g('w-ora-fine').value;
    if(g('w-data-redazione')) v.dataRedazione = g('w-data-redazione').value;
    if(g('w-ora-redazione')) v.oraRedazione = g('w-ora-redazione').value;
  } else if(step==='ordinegiorno'){
    const og = v.ordineGiorno;
    if(g('w-og-variazioni-chk')) og.variazioni.checked = g('w-og-variazioni-chk').checked;
    if(g('w-og-variazioni-testo')) og.variazioni.testo = g('w-og-variazioni-testo').value;
    if(g('w-og-verificadoc-chk')) og.verificaDoc.checked = g('w-og-verificadoc-chk').checked;
    // affidataria/subappalto/autonomi: menù a tendina + eventuale campo libero, legati live in
    // attachHandlers() (data-og-vdoc-select/data-og-vdoc-text) — non serve rileggerli qui.
  } else if(step==='verifiche'){
    ['pos','art102','organizzazione'].forEach(key=>{
      if(g('w-ver-'+key+'-chk')) v.verifiche[key].checked = g('w-ver-'+key+'-chk').checked;
      if(g('w-ver-'+key+'-testo')) v.verifiche[key].testo = g('w-ver-'+key+'-testo').value;
    });
  } else if(step==='rls'){
    v.rls.forEach((r,idx)=>{
      if(g('w-rls-chk-'+idx)) r.checked = g('w-rls-chk-'+idx).checked;
      if(g('w-rls-nome-'+idx)) r.nome = g('w-rls-nome-'+idx).value;
    });
    if(g('w-rls-assenti')) v.rlsAssenti = g('w-rls-assenti').checked;
    if(g('w-rls-note')) v.rlsNote = g('w-rls-note').value;
  } else if(step==='note'){
    if(g('w-prossima-riunione')) v.prossimaRiunione = g('w-prossima-riunione').value;
    if(g('w-note-cse')) v.noteCSE = g('w-note-cse').value;
  }
}

const profileBadgeEl = document.getElementById('profile-badge');
if(profileBadgeEl) profileBadgeEl.addEventListener('click', ()=> go({name:'profilo'}));

/* Accesso nascosto all'area admin: 6 tocchi ravvicinati sul logo (entro 2,5s l'uno dall'altro,
   altrimenti il conteggio si azzera) aprono la schermata di login dell'area admin (richiesta
   09/09/2026). Il logo vive nell'intestazione statica (fuori da #app, mai rigenerata da render()),
   quindi questo listener va registrato una sola volta qui, non in attachHandlers(). */
let logoTapCount = 0;
let logoTapResetTimer = null;
const logoImgEl = document.querySelector('.brand-logo-wrap img');
if(logoImgEl) logoImgEl.addEventListener('click', ()=>{
  logoTapCount++;
  clearTimeout(logoTapResetTimer);
  logoTapResetTimer = setTimeout(()=>{ logoTapCount = 0; }, 2500);
  if(logoTapCount >= 6){
    logoTapCount = 0;
    clearTimeout(logoTapResetTimer);
    go({name:'admin-login'});
  }
});

/* La barra del titolo (.topbar) resta agganciata subito sotto la barra logo fissa (.brand-header)
   durante lo scroll: l'altezza reale della barra logo viene misurata e tenuta sincronizzata con una
   variabile CSS, invece di un offset fisso che si disallineava dopo un ridimensionamento del logo. */
function syncHeaderHeight(){
  const header = document.querySelector('.brand-header');
  if(header) document.documentElement.style.setProperty('--hdr-h', header.offsetHeight + 'px');
}
syncHeaderHeight();
window.addEventListener('resize', syncHeaderHeight);
window.addEventListener('orientationchange', syncHeaderHeight);

boot();
</script>
