/* ======================= TRASFERIMENTO DATI (esporta/importa cantieri, imprese, personale) =======================
   Copia gli archivi (solo locali) su un altro dispositivo via file .json, con merge "intelligente":
   niente duplicati per nome, e il personale importato si ricollega all'impresa locale corrispondente. */
// `sezioni` indica quali sezioni includere nell'esportazione, es. {cantieri:true, imprese:false, personale:true}.
// Le Imprese vengono comunque incluse (solo come riferimento) anche quando non selezionate esplicitamente,
// se si esporta il Personale: servono per ricollegare correttamente le persone alle rispettive imprese
// quando il file viene importato su un altro dispositivo.
function buildDatiArchivioExport(sezioni){
  const sel = sezioni || {cantieri:true, imprese:true, personale:true, frasi:true, fasiLavoro:true, destinatari:true};
  const out = {
    tipo: 'gdg-verbali-cse-export',
    versione: 1,
    esportatoIl: new Date().toISOString(),
    sezioni: {cantieri:!!sel.cantieri, imprese:!!sel.imprese, personale:!!sel.personale, frasi:!!sel.frasi, fasiLavoro:!!sel.fasiLavoro, destinatari:!!sel.destinatari},
  };
  if(sel.cantieri) out.cantieri = DB.cantieri;
  if(sel.imprese || sel.personale) out.imprese = DB.imprese;
  if(sel.personale) out.personale = DB.personale;
  if(sel.frasi) out.frasi = DB.frasi;
  if(sel.fasiLavoro) out.fasiLavoro = DB.fasiLavoro;
  if(sel.destinatari) out.destinatari = DB.destinatari;
  return out;
}
async function esportaDatiArchivio(sezioni){
  const sel = sezioni || {cantieri:true, imprese:true, personale:true, frasi:true, fasiLavoro:true, destinatari:true};
  if(!sel.cantieri && !sel.imprese && !sel.personale && !sel.frasi && !sel.fasiLavoro && !sel.destinatari){ toast('Seleziona almeno una sezione da esportare.'); return; }
  try{
    const json = JSON.stringify(buildDatiArchivioExport(sel), null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const parts = [];
    if(sel.cantieri) parts.push('cantieri');
    if(sel.imprese) parts.push('imprese');
    if(sel.personale) parts.push('personale');
    if(sel.frasi) parts.push('osservanze');
    if(sel.fasiLavoro) parts.push('fasi-lavoro');
    if(sel.destinatari) parts.push('destinatari');
    const filename = `gdg-dati-${parts.join('-')}-${todayISO()}.json`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('Dati esportati');
  }catch(e){ console.error(e); toast('Errore nell\'esportazione dei dati.'); }
}
// unisce i dati importati in DB.cantieri/imprese/personale SENZA MAI cancellare o sovrascrivere quanto già
// presente: ogni record viene solo aggiunto se non già esistente (confronto per nome), evitando duplicati,
// e ricollegando correttamente il personale importato all'impresa giusta (nuova o già esistente in locale).
// `sezioni` indica quali sezioni importare davvero (es. {cantieri:false, imprese:false, personale:true}):
// le imprese presenti nel file vengono comunque usate per il solo ricollegamento del personale anche se
// la sezione Imprese non è selezionata, ma in quel caso non viene creata nessuna nuova impresa — il
// personale la cui impresa non esiste già in locale (stesso nome) viene ignorato (stats.personaleSaltato).
function importDatiArchivio(data, sezioni){
  const sel = sezioni || {cantieri:true, imprese:true, personale:true, frasi:true, fasiLavoro:true, destinatari:true};
  const stats = {cantieriNuovi:0, cantieriEsistenti:0, impreseNuove:0, impreseEsistenti:0, personaleNuovo:0, personaleEsistente:0, personaleSaltato:0,
    frasiNuove:0, frasiEsistenti:0, fasiLavoroVociNuove:0, fasiLavoroVociEsistenti:0, fasiLavoroCategorieNuove:0, destinatariNuovi:0, destinatariEsistenti:0};
  const impresaIdMap = {};

  (data.imprese||[]).forEach(imp=>{
    const existing = DB.imprese.find(x=>(x.nome||'').trim().toLowerCase()===(imp.nome||'').trim().toLowerCase());
    if(existing){
      impresaIdMap[imp.id] = existing.id;
      if(sel.imprese) stats.impreseEsistenti++;
    } else if(sel.imprese){
      const newId = uid();
      DB.imprese.push({...imp, id:newId});
      impresaIdMap[imp.id] = newId;
      stats.impreseNuove++;
    }
    // se la sezione Imprese non è selezionata e l'impresa non esiste già in locale, resta senza
    // mappatura: il personale eventualmente collegato a questa impresa verrà ignorato più sotto,
    // per non creare collegamenti a un'impresa inesistente.
  });

  if(sel.cantieri){
    (data.cantieri||[]).forEach(c=>{
      const existing = DB.cantieri.find(x=>(x.nome||'').trim().toLowerCase()===(c.nome||'').trim().toLowerCase());
      if(existing){ stats.cantieriEsistenti++; }
      else{ DB.cantieri.push({...c, id:uid()}); stats.cantieriNuovi++; }
    });
  }

  if(sel.personale){
    (data.personale||[]).forEach(p=>{
      const localImpresaId = impresaIdMap[p.impresaId];
      if(!localImpresaId){ stats.personaleSaltato++; return; }
      const dup = DB.personale.find(x=>x.impresaId===localImpresaId
        && (x.nome||'').trim().toLowerCase()===(p.nome||'').trim().toLowerCase()
        && (x.cognome||'').trim().toLowerCase()===(p.cognome||'').trim().toLowerCase());
      if(dup){ stats.personaleEsistente++; }
      else{ DB.personale.push({...p, id:uid(), impresaId:localImpresaId}); stats.personaleNuovo++; }
    });
  }

  // Libreria osservanze: una frase è "la stessa" se ha la stessa categoria e lo stesso testo (a meno di spazi/maiuscole)
  if(sel.frasi){
    (data.frasi||[]).forEach(f=>{
      const dup = DB.frasi.find(x=>x.categoria===f.categoria && (x.testo||'').trim().toLowerCase()===(f.testo||'').trim().toLowerCase());
      if(dup){ stats.frasiEsistenti++; }
      else{ DB.frasi.push({...f, id:uid()}); stats.frasiNuove++; }
    });
  }

  // Fasi di lavoro: categorie abbinate per nome (case-insensitive); le voci di una categoria già
  // esistente vengono aggiunte a quelle già presenti (senza duplicati), mai sostituite.
  if(sel.fasiLavoro){
    (data.fasiLavoro||[]).forEach(cat=>{
      const nomeCat = (cat.categoria||'').trim();
      let localCat = DB.fasiLavoro.find(x=>(x.categoria||'').trim().toLowerCase()===nomeCat.toLowerCase());
      if(!localCat){ localCat = {categoria:nomeCat, voci:[]}; DB.fasiLavoro.push(localCat); stats.fasiLavoroCategorieNuove++; }
      (cat.voci||[]).forEach(voce=>{
        const v = (voce||'').trim(); if(!v) return;
        const dup = localCat.voci.some(x=>(x||'').trim().toLowerCase()===v.toLowerCase());
        if(dup){ stats.fasiLavoroVociEsistenti++; }
        else{ localCat.voci.push(v); stats.fasiLavoroVociNuove++; }
      });
    });
  }

  // Destinatari: dedup per nome (come cantieri/imprese)
  if(sel.destinatari){
    (data.destinatari||[]).forEach(d=>{
      const existing = DB.destinatari.find(x=>(x.nome||'').trim().toLowerCase()===(d.nome||'').trim().toLowerCase());
      if(existing){ stats.destinatariEsistenti++; }
      else{ DB.destinatari.push({...d, id:uid()}); stats.destinatariNuovi++; }
    });
  }

  return stats;
}

    <label class="phrase-item"><input type="checkbox" id="exp-sel-imprese" checked><div class="txt">Imprese (${DB.imprese.length})</div></label>

    const defaultChecked = (chiave, presente) => presente && (sezioniDichiarate ? !!sezioniDichiarate[chiave] : true);
    const checkboxRow = (id, chiave, label, count, presente) => !presente ? '' : `
      <label class="phrase-item"><input type="checkbox" id="${id}" ${defaultChecked(chiave, presente)?'checked':''}><div class="txt">${label} (${count} nel file)</div></label>`;
    const fasiLavoroVociCountFile = (preview.fasiLavoro||[]).reduce((n,c)=>n+(c.voci||[]).length, 0);
    importaBody = `
      <div class="hint" style="margin-bottom:10px;line-height:1.5;">Trovati nel file: <b>${(preview.cantieri||[]).length}</b> cantieri, <b>${(preview.imprese||[]).length}</b> imprese, <b>${(preview.personale||[]).length}</b> persone, <b>${(preview.frasi||[]).length}</b> frasi della libreria osservanze, <b>${(preview.fasiLavoro||[]).length}</b> categorie di fasi di lavoro, <b>${(preview.destinatari||[]).length}</b> destinatari. Scegli quali sezioni importare — i duplicati verranno riconosciuti e non ripetuti, nulla di esistente viene mai cancellato:</div>
      ${checkboxRow('imp-sel-cantieri','cantieri','Cantieri', (preview.cantieri||[]).length, haCantieri)}
      ${checkboxRow('imp-sel-imprese','imprese','Imprese', (preview.imprese||[]).length, haImprese)}
      ${checkboxRow('imp-sel-personale','personale','Personale', (preview.personale||[]).length, haPersonale)}
      ${checkboxRow('imp-sel-frasi','frasi','Libreria osservanze', (preview.frasi||[]).length, haFrasi)}
      ${checkboxRow('imp-sel-fasiLavoro','fasiLavoro','Fasi di lavoro', `${(preview.fasiLavoro||[]).length} categorie, ${fasiLavoroVociCountFile} voci`, haFasiLavoro)}
      ${checkboxRow('imp-sel-destinatari','destinatari','Destinatari', (preview.destinatari||[]).length, haDestinatari)}
      ${!haCantieri&&!haImprese&&!haPersonale&&!haFrasi&&!haFasiLavoro&&!haDestinatari ? `<div class="hint">Il file non contiene sezioni riconosciute.</div>` : ''}
      ${haPersonale ? `<div class="hint" style="margin-top:8px;">Se importi il Personale senza le Imprese, verranno aggiunte solo le persone la cui impresa esiste già su questo dispositivo (stesso nome); le altre verranno ignorate.</div>` : ''}
      <div class="btn-row">
        <button class="btn secondary" data-import-dati-back="1">‹ Annulla</button>
        <button class="btn" data-import-dati-commit="1">Importa</button>
      </div>
    `;
  }

  return topWrap('Esporta / Importa dati', '', `
    <section class="block">
      <h3>Esporta</h3>
      <p style="font-size:13px;margin:0 0 8px;line-height:1.5;">Scarica un file con i dati archiviati in quest'app (Cantieri, Imprese, Personale, Libreria osservanze, Fasi di lavoro, Destinatari), per portarli su un altro dispositivo o un'altra installazione dell'app.</p>
      ${exportSezioniHtml}
      <button class="btn" data-export-dati="1" style="margin-top:10px;">⬇️ Esporta i dati selezionati</button>
    </section>
    <section class="block">
      <h3>Importa</h3>
      ${importaBody}
    </section>
  `);
}

/* ======================= ARCHIVIO VERBALI ======================= */
/* Etichetta breve del tipo di verbale, usata nell'Archivio per distinguere a colpo d'occhio i
   verbali di visita (Allegato 10) da quelli di riunione iniziale (Allegato 8) — condividono lo
   stesso archivio/numerazione per cantiere ma restano due documenti diversi (richiesta 23/09/2026). */
function tipoVerbaleLabel(tipo){ return tipo==='riunione' ? 'Riunione iniziale' : 'Visita'; }

function viewArchivio(){
  ROUTE.filters = ROUTE.filters || {cantiere:'', numero:'', data:'', tipo:''};
  const f = ROUTE.filters;
  const matchFiltri = v => (!f.cantiere || v.cantiereId===f.cantiere)
    && (!f.numero || String(v.numero).includes(f.numero))
    && (!f.data || v.data===f.data)
    && (!f.tipo || (v.tipo||'visita')===f.tipo);

  let list = DB.verbaliIndex.filter(matchFiltri);
  list.sort((a,b)=> (b.data||'').localeCompare(a.data||'') || (b.createdAt||0)-(a.createdAt||0));

  const idLocali = new Set(DB.verbaliIndex.map(v=>v.id));
  let remoti = CLOUD_VERBALI.filter(v=>!idLocali.has(v.id)).filter(matchFiltri);
  remoti.sort((a,b)=> (b.data||'').localeCompare(a.data||'') || (b.createdAt||0)-(a.createdAt||0));

  const cantiereOpts = `<option value="">Tutti i cantieri</option>` +
    DB.cantieri.map(c=>`<option value="${c.id}" ${f.cantiere===c.id?'selected':''}>${esc(c.nome)}</option>`).join('');
  const tipoOpts = `<option value="">Tutti i tipi</option>
    <option value="visita" ${f.tipo==='visita'?'selected':''}>Visita</option>
    <option value="riunione" ${f.tipo==='riunione'?'selected':''}>Riunione iniziale</option>`;

  const rows = list.map(v=>`
    <div class="item-row">
      <div class="main">
        <div class="t">Verbale n° ${v.numero}/${v.anno} — ${esc(v.cantiereNome||'')}</div>
        <div class="s">${tipoVerbaleLabel(v.tipo)} · ${fmtDate(v.data)} · ${v.stato==='finale'?'✅ finalizzato':'📝 bozza'}${v.cse?` · compilato da ${esc(v.cse)}`:''}</div>
      </div>
      <div class="actions">
        <button class="iconbtn" data-open-verbale="${v.id}">Apri</button>
        <button class="iconbtn" data-dup-verbale="${v.id}">Duplica</button>
        <button class="iconbtn" data-del-verbale="${v.id}">🗑</button>
      </div>
    </div>`).join('') || emptyState('📂','Nessun verbale trovato','Prova a modificare i filtri o crea un nuovo verbale.');

  const remoteRows = remoti.map(v=>`
    <div class="item-row">
      <div class="main">
        <div class="t">Verbale n° ${v.numero}/${v.anno} — ${esc(v.cantiereNome||'')}</div>
        <div class="s">${tipoVerbaleLabel(v.tipo)} · ${fmtDate(v.data)}${v.cse?` · compilato da ${esc(v.cse)}`:''} · 🔗 su un altro dispositivo</div>
      </div>
    </div>`).join('');

  const remoteSectionHtml = CLOUD_DB ? `
    <section class="block">
      <h3>Verbali di altri dispositivi</h3>
      <div class="hint" style="margin-bottom:8px;">Elenco condiviso in tempo reale con tutta l'azienda: si vede chi ha compilato cosa, ma il contenuto completo (foto comprese) resta disponibile solo sul dispositivo che ha creato il verbale.</div>
      ${remoteRows || `<div class="hint">Nessun verbale trovato su altri dispositivi.</div>`}
    </section>` : `
    <section class="block">
      <div class="hint">ℹ️ Qui comparirebbero anche i verbali creati su altri dispositivi (elenco condiviso con tutta l'azienda), ma solo aprendo il link dell'app fornito da GDG STUDIO — anche installandolo sulla schermata Home dell'iPhone/telefono. Con il file HTML scaricato, invece, questa sincronizzazione non è disponibile e si vedono solo i verbali creati su questo dispositivo.</div>
    </section>`;

  return topWrap('Archivio verbali','', `
    <section class="block">
      <label>Cantiere</label>
      <select id="filt-cantiere">${cantiereOpts}</select>
      <label>Tipo</label>
      <select id="filt-tipo">${tipoOpts}</select>
      <div class="row2">
        <div><label>N° verbale</label><input type="text" id="filt-numero" value="${esc(f.numero)}"></div>
        <div><label>Data</label><input type="date" id="filt-data" value="${f.data}"></div>
      </div>
    </section>
    <section class="block" style="padding:4px 14px;">${rows}</section>
    ${remoteSectionHtml}
  `);
}

/* ======================= WIZARD STEPS ======================= */
const STEPS = ['cantiere','orari','imprese','presenti','fasi','osservanze','sospensione','firme','destinatari'];
const STEP_TITLES = {
  cantiere:'Cantiere e data', orari:'Orari della visita', imprese:'Imprese coinvolte',
  presenti:'Presenti al sopralluogo', fasi:'Fasi di lavoro e foto', osservanze:'Osservanze',
  sospensione:'Sospensione lavori (se necessaria)', firme:'Firme', destinatari:'Destinatari e invio'
};

/* Verbale di riunione iniziale di coordinamento (Allegato 8, richiesta 23/09/2026): passaggi propri
   del wizard, distinti da STEPS/STEP_TITLES sopra (verbale di visita, Allegato 10). I passaggi
   "cantiere", "presenti" e "destinatari" condividono lo stesso nome e la stessa funzione wiz* del
   verbale di visita (vedi viewWizard()) perché operano su campi generici identici. */
const RIUNIONE_STEPS = ['cantiere','incontro','imprese','presenti','ordinegiorno','verifiche','rls','note','firme','destinatari'];
const RIUNIONE_STEP_TITLES = {
  cantiere:'Cantiere e data', incontro:'Luogo e orari della riunione', imprese:'Imprese e referenti',
  presenti:'Presenti alla riunione', ordinegiorno:'Ordine del giorno',
  verifiche:'Verifiche del CSE (POS, PSC, organizzazione)', rls:'Rappresentanti per la sicurezza (RLS/RLST)',
  note:'Note del CSE e prossima riunione', firme:'Firma', destinatari:'Destinatari e invio'
};

function stepperHtml(step, steps, titles){
  const idx = steps.indexOf(step);
  return `<div class="stepper">${steps.map((s,i)=>`<div class="dot ${i<idx?'done':i===idx?'active':''}"></div>`).join('')}</div>
  <div class="step-label">Passaggio ${idx+1} di ${steps.length} · ${titles[step]}</div>`;
}

function viewWizard(step){
  if(!CURRENT_VERBALE){ go({name:'home'}); return ''; }
  const v = CURRENT_VERBALE;
  const isRiunione = v.tipo==='riunione';
  const steps = isRiunione ? RIUNIONE_STEPS : STEPS;
  const titles = isRiunione ? RIUNIONE_STEP_TITLES : STEP_TITLES;
  step = step || steps[0];
  let body='';
  if(step==='cantiere') body=wizCantiere(v);
  else if(step==='orari') body=wizOrari(v);
  else if(step==='incontro') body=wizIncontro(v);
  else if(step==='imprese') body = isRiunione ? wizImpreseRiunione(v) : wizImprese(v);
  else if(step==='presenti') body=wizPresenti(v);
  else if(step==='fasi') body=wizFasi(v);
  else if(step==='osservanze') body=wizOsservanze(v);
  else if(step==='sospensione') body=wizSospensione(v);
  else if(step==='ordinegiorno') body=wizOrdineGiorno(v);
  else if(step==='verifiche') body=wizVerifiche(v);
  else if(step==='rls') body=wizRls(v);
  else if(step==='note') body=wizNoteRiunione(v);
  else if(step==='firme') body = isRiunione ? wizFirmeRiunione(v) : wizFirme(v);
  else if(step==='destinatari') body=wizDestinatari(v);

  const idx = steps.indexOf(step);
  const isLast = idx===steps.length-1;
  return `
  <div class="topbar">
    ${idx>0
      ? `<button class="back" data-wizard-nav="${steps[idx-1]}">‹</button>`
      : `<button class="back" data-go="home-confirm">‹</button>`}
    <h1>Verbale n° ${v.numero}/${v.anno}<span class="sub">${esc(v.cantiereNome)}</span></h1>
    <button class="save-draft" data-save-bozza-wizard="1" title="Salva il verbale come bozza senza uscire dalla compilazione">💾 Bozza</button>
  </div>
  ${stepperHtml(step, steps, titles)}
  <div class="content">
    ${body}
    <div class="btn-row">
      ${idx>0?`<button class="btn secondary" data-wizard-nav="${steps[idx-1]}">‹ Indietro</button>`:'<div style="flex:1"></div>'}
      ${isLast?`<button class="btn" data-go-anteprima="1">Anteprima ›</button>`
              :`<button class="btn" data-wizard-nav="${steps[idx+1]}">Avanti ›</button>`}
    </div>
  </div>`;
}

function wizCantiere(v){
  // i cantieri completati non sono selezionabili per un nuovo verbale, ma se questo verbale ne usa già
  // uno (es. una bozza aperta prima che il cantiere venisse completato) resta comunque in elenco/selezionato,
  // altrimenti la select perderebbe il valore e cantiereNome/cantiereId non combacerebbero più.
  const opts = DB.cantieri.filter(c=>!c.completato || c.id===v.cantiereId)
    .map(c=>`<option value="${c.id}" ${c.id===v.cantiereId?'selected':''}>${esc(c.nome)}${c.completato?' (completato)':''}</option>`).join('');
  return `
  <section class="block">
    <label>Cantiere *</label>
    <select id="w-cantiere" data-cantiere-autofill="1">${opts||'<option value="">Nessun cantiere — creane uno prima</option>'}</select>
    <label>Sito in</label>
    <input type="text" id="w-sito" value="${esc(v.sito)}">
    <label>Committente</label>
    <input type="text" id="w-committente" value="${esc(v.committente)}">
    <label>Responsabile Lavori</label>
    <input type="text" id="w-rl" value="${esc(v.responsabileLavori)}">
    <div class="row2">
      <div><label>Numero verbale</label><input type="number" id="w-numero" value="${v.numero}"></div>
      <div><label>Anno</label><input type="number" id="w-anno" value="${v.anno}"></div>
    </div>
    <label>Data visita *</label>
    <input type="date" id="w-data" value="${v.data}">
    <label>Il CSE (coordinatore)</label>
    <input type="text" id="w-cse" value="${esc(v.cse)}">
  </section>`;
}

function wizImprese(v){

  const cards = v.impreseCoinvolte.map((ic,idx)=>`
    <div class="impresa-card">
      <div class="head"><div class="name">${esc(ic.nome)}</div>
        <button class="iconbtn" data-rm-impresa-verbale="${idx}">Rimuovi</button></div>
      <div class="role-select">
        ${IMPRESA_RUOLI.map(r=>`<span class="chip ${ruoliOf(ic).includes(r)?'on':''}" data-set-ruolo-impresa="${idx}" data-ruolo="${r}">${r}</span>`).join('')}
      </div>
      <div class="hint" style="margin-top:4px;">Tocca per selezionare uno o più ruoli.</div>
    </div>`).join('') || `<div class="hint">Nessuna impresa selezionata per questo verbale.</div>`;

    <label>Aggiungi impresa dall'archivio</label>
    <select id="w-add-impresa">${addOpts}</select>
    <button class="btn secondary small" style="margin-top:8px;" data-add-impresa-verbale="1">＋ Aggiungi</button>
    `:`<div class="hint">Tutte le imprese archiviate sono già state aggiunte. Puoi aggiungerne di nuove nella sezione Imprese.</div>`}
  </section>`;
}

function wizPresenti(v){
  const groups = v.impreseCoinvolte.map(ic=>{
    const persone = DB.personale.filter(p=>p.impresaId===ic.impresaId);
    const rows = persone.map(p=>{
      const searchBlob = `${p.nome} ${p.cognome} ${p.mansione||''}`.toLowerCase();
      return `

      </div>`;
    }).join('') || `<div class="hint">Nessun dipendente archiviato per questa impresa. Aggiungili dalla sezione Personale.</div>`;
    return `
    <details class="pers-group" data-impresa-id="${ic.impresaId}" ${PERS_GROUP_OPEN[ic.impresaId]?'open':''}>

        <span class="name">${esc(ic.nome)}<span class="cnt">(${persone.length})</span></span>

      <div class="pers-body">
        ${rows}
        <div class="hint pers-filtered-hint" style="display:none;">Nessun dipendente corrisponde alla ricerca.</div>
      </div>

  }).join('') || `<div class="hint">Aggiungi prima le imprese coinvolte nel passaggio precedente.</div>`;

  const altriRows = v.altriPresenti.map((p,idx)=>`
    <div class="item-row">
      <div class="main"><input type="text" class="altro-presente-input" data-idx="${idx}" value="${esc(p)}" style="border:none;padding:4px 0;font-size:14px;" placeholder="Nome - ruolo (es. Ing. Rossi - Direttore Lavori)"></div>
      <button class="iconbtn" data-rm-altro-presente="${idx}">✕</button>
    </div>`).join('') || `<div class="hint">Nessun altro presente aggiunto.</div>`;

  return `
  <section class="block">
    <h3>Operai/dipendenti presenti</h3>
    ${v.impreseCoinvolte.length ? `<input type="text" id="wiz-presenti-search" placeholder="Cerca un nominativo…" value="${esc(WIZ_PRESENTI_FILTRI.search)}" style="margin-bottom:10px;">` : ''}
    ${groups}
  </section>
  <section class="block">
    <h3>Altri presenti (CSE, DL, committente, ecc.)</h3>
    ${altriRows}
    <div class="btn-row" style="margin-top:10px;">
      <button class="btn secondary" data-add-altro-presente="1">＋ Aggiungi</button>
    </div>
  </section>`;
}

/* Filtra dal vivo (senza re-render) le righe dipendente nel passaggio "Presenti" del wizard,
   in base a WIZ_PRESENTI_FILTRI.search. Apre in automatico le imprese con risultati corrispondenti. */
function applyWizPresentiFiltri(){
  const q = (WIZ_PRESENTI_FILTRI.search||'').trim().toLowerCase();
  document.querySelectorAll('#app .pers-group').forEach(group=>{
    const rows = [...group.querySelectorAll('.personale-check[data-pers-search]')];
    if(rows.length===0) return;
    let anyVisible = false;
    rows.forEach(row=>{
      const visible = !q || row.dataset.persSearch.includes(q);
      row.style.display = visible ? '' : 'none';
      if(visible) anyVisible = true;
    });
    const hint = group.querySelector('.pers-filtered-hint');
    if(hint) hint.style.display = (!anyVisible) ? '' : 'none';
    if(q) group.open = anyVisible;
  });
}

function wizOsservanze(v){
  const impreseInVerbale = v.impreseCoinvolte;
  if(impreseInVerbale.length===0){
    return `<section class="block"><div class="hint">Aggiungi prima almeno un'impresa nel passaggio "Imprese coinvolte" per poter compilare le osservanze.</div></section>`;
  }
  const active = ROUTE.osservanzaImpresaId || impreseInVerbale[0].impresaId;
  const tabs = impreseInVerbale.map(ic=>`<span class="chip ${ic.impresaId===active?'on':''}" data-osserv-tab="${ic.impresaId}">${esc(ic.nome)}</span>`).join('');

  let oss = v.osservanze.find(o=>o.impresaId===active);
  if(!oss){ oss = {impresaId:active, selFrasi:[], noteLibere:'', selPrescrizioni:[], prescrizioniLibere:'', noteSpecificheLibere:'', foto:[]}; v.osservanze.push(oss); }

  function catBlock(cat){
    const items = DB.frasi.filter(f=>f.categoria===cat);
    const list = cat==='prescrizioni' ? oss.selPrescrizioni : oss.selFrasi;
    const rows = items.map(f=>`
      <div class="phrase-item">
        <input type="checkbox" data-osserv-check="${cat}" data-frase="${f.id}" ${list.includes(f.id)?'checked':''}>
        <div class="txt">${esc(f.testo)}</div>
      </div>`).join('') || `<div class="hint">Nessuna frase — aggiungine nella Libreria osservanze.</div>`;
    const allSelected = items.length>0 && items.every(f=>list.includes(f.id));
    const selectAll = items.length>0 ? `
      <label class="phrase-item" style="font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px;">
        <input type="checkbox" data-osserv-select-all="${cat}" ${allSelected?'checked':''}>
        <div class="txt">Seleziona / deseleziona tutte</div>
      </label>` : '';

/* ---- firma grafica: disegno a mano libera o immagine caricata, per ciascuno dei 4 spazi firma
   (CSE, assistente CSE, preposto per impresa, firma extra) — chiave testuale -> campo su CURRENT_VERBALE ---- */
function setFirmaImg(v, key, val){
  if(key==='cse'){ v.firmaCSEImg = val; return; }
  if(key==='assistente'){ v.assistenteCSEImg = val; return; }
  if(key==='extra'){ v.firmaExtra.img = val; return; }
  const m = /^preposto-(\d+)$/.exec(key);
  if(m && v.impreseCoinvolte[+m[1]]) v.impreseCoinvolte[+m[1]].firmaPrepostoImg = val;
}
function signatureBlock(key, img, label){
  const filenameBase = 'Firma_' + (label||key).replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'');
  if(img){
    return `
    <div class="sig-pad-wrap" data-sig-key="${key}">
      <div class="sig-preview"><img src="${img}" alt="Firma"></div>
      <div class="btn-row">
        <button class="btn small secondary" type="button" data-sig-redo="${key}">Cambia / rimuovi firma</button>
        <button class="btn small ghost" type="button" data-sig-download="${key}" data-sig-filename="${esc(filenameBase)}">⬇️ Scarica PNG</button>
      </div>
    </div>`;
  }
  return `
  <div class="sig-pad-wrap" data-sig-key="${key}">
    <div class="sig-canvas-box">
      <canvas class="sig-canvas" data-sig-canvas="${key}" width="600" height="160"></canvas>
      <div class="sig-canvas-overlay" data-sig-overlay="${key}">👆 Tocca qui per iniziare a firmare</div>
    </div>
    <div class="hint">Tocca il riquadro per attivarlo, poi disegna la firma col dito o il mouse — così puoi scorrere la pagina senza firmare per sbaglio. In alternativa, carica una foto/immagine della firma.</div>
    <div class="btn-row">
      <button class="btn small secondary" type="button" data-sig-erase="${key}">Cancella</button>
      <button class="btn small" type="button" data-sig-save="${key}">Salva firma disegnata</button>
    </div>
    <label class="btn small secondary" style="display:block;text-align:center;margin-top:6px;" for="sig-file-${key}">📎 Carica immagine firma</label>
    <input type="file" id="sig-file-${key}" data-sig-file="${key}" accept="image/*" style="display:none;">
  </div>`;
}

/* Candidati preposto per una data impresa: solo il personale già spuntato come presente
   (passaggio "Presenti" del wizard) e appartenente a quell'impresa — così il preposto si sceglie
   da un menù a tendina invece di essere ridigitato a mano (richiesta 09/09/2026). */
function candidatiPrepostoImpresa(v, impresaId){
  return DB.personale.filter(p => p.impresaId===impresaId && v.presentiPersonale.includes(p.id));
}
function wizFirme(v){
  const prepostiRows = v.impreseCoinvolte.map((ic,idx)=>{
    const candidati = candidatiPrepostoImpresa(v, ic.impresaId);
    const prepostoValue = ic.preposto||'';
    const candidatoAttuale = candidati.find(p => `${p.nome} ${p.cognome}` === prepostoValue);
    const isAltro = !!ic.prepostoAltro || (!!prepostoValue && !candidatoAttuale);
    if(candidati.length===0){
      // nessun presente spuntato per questa impresa: resta il campo libero, con un promemoria
      return `
      <label>Preposto — ${esc(ic.nome)}</label>
      <input type="text" data-preposto-idx="${idx}" value="${esc(prepostoValue)}" placeholder="Nome e cognome del preposto">
      <div class="hint">Nessun presente spuntato per questa impresa nel passaggio "Presenti": qui puoi comunque scrivere il nome a mano, oppure torna indietro e spuntalo per poterlo scegliere da un elenco.</div>
      ${signatureBlock('preposto-'+idx, ic.firmaPrepostoImg||null, 'Preposto_'+ic.nome)}
      `;
    }
    const options = [`<option value="">Seleziona preposto…</option>`]
      .concat(candidati.map(p=>{
        const val = `${p.nome} ${p.cognome}`;
        const label = p.mansione ? `${val} — ${esc(p.mansione)}` : val;
        return `<option value="${esc(val)}" ${val===prepostoValue?'selected':''}>${label}</option>`;
      }))
      .concat([`<option value="__altro__" ${isAltro?'selected':''}>✎ Altro (scrivi il nome)</option>`])
      .join('');
    return `
    <label>Preposto — ${esc(ic.nome)}</label>
    <select data-preposto-select-idx="${idx}">${options}</select>
    ${isAltro?`<input type="text" data-preposto-idx="${idx}" value="${esc(prepostoValue)}" placeholder="Nome e cognome del preposto" style="margin-top:6px;">`:''}
    ${signatureBlock('preposto-'+idx, ic.firmaPrepostoImg||null, 'Preposto_'+ic.nome)}
    `;
  }).join('') || `<div class="hint">Aggiungi prima le imprese coinvolte per poter indicare i rispettivi preposti.</div>`;

  return `
  <section class="block">
    <h3>Firme del verbale</h3>
    <div class="hint">Il documento finale riporta una riga firma per ciascun nominativo indicato qui sotto. Per ogni firma puoi disegnarla col dito/mouse oppure caricare un'immagine — resta comunque possibile firmare a mano sul foglio stampato.</div>
    <label>Il coordinatore della sicurezza in fase di esecuzione (CSE)</label>
    <input type="text" id="w-cse-firma" value="${esc(v.cse)}">
    ${signatureBlock('cse', v.firmaCSEImg||null, 'CSE')}
    <label>Assistente CSE</label>
    <input type="text" id="w-assistente-cse" value="${esc(v.assistenteCSE)}" placeholder="Nome e cognome (opzionale)">
    ${signatureBlock('assistente', v.assistenteCSEImg||null, 'Assistente_CSE')}
  </section>
  <section class="block">
    <h3>Preposto per ciascuna impresa</h3>
    ${prepostiRows}
  </section>
  <section class="block">
    <h3>Firma extra</h3>
    <label>Etichetta</label>
    <input type="text" id="w-extra-label" value="${esc(v.firmaExtra.label)}" placeholder="Es. Committente, Rappresentante ITG…">
    <label>Nome e cognome</label>
    <input type="text" id="w-extra-nome" value="${esc(v.firmaExtra.nome)}" placeholder="(opzionale)">
    ${signatureBlock('extra', v.firmaExtra.img||null, v.firmaExtra.label||'Extra')}
  </section>`;
}

/* ======================= WIZARD — VERBALE DI RIUNIONE INIZIALE (Allegato 8) =======================
   Passaggi propri (vedi RIUNIONE_STEPS sopra): il modello di riferimento (Italgas Reti, Allegato 8 —
   VERBALE RIUNIONE INIZIALE DI COORDINAMENTO) ha una struttura diversa dalla visita di cantiere, con
   luogo/orari della riunione, un referente per ciascuna impresa, un ordine del giorno, alcune verifiche
   di competenza del CSE, l'elenco degli RLS/RLST invitati e le note finali del CSE. La corposa parte
   di testo fisso a carattere legale/normativo del modello (riferimenti al D.Lgs 81/2008, procedure di
   verifica, ecc.) è riportata come testo fisso nel documento generato (vedi viewDocumentoRiunione()),
   non come campi compilabili, per non appesantire il wizard: qui restano modificabili solo i punti
   effettivamente variabili individuati nel modello di riferimento caricato dall'utente. */

/* Candidati referente per una data impresa, nel passaggio "Imprese e referenti": qui (a differenza
   del Preposto nel passaggio "Firme") il passaggio "Presenti" non e' ancora stato compilato, quindi
   si propongono tutti i dipendenti archiviati per quell'impresa (non solo i presenti spuntati),
   come richiesto dall'utente ("selezionare tra i dipendenti dell'impresa selezionata", 24/09/2026). */
function candidatiReferenteImpresa(impresaId){
  return DB.personale.filter(p => p.impresaId===impresaId);
}

/* Come wizImprese(), ma con in più il referente (nome e mansione) che ciascuna impresa indica per la
   riunione — richiesto dal modello ("con: [ruolo] nella persona di ... avente mansioni di ..."),
   assente nel verbale di visita. Aggiunta/rimozione impresa e selezione ruoli riusano esattamente gli
   stessi gestori di wizImprese() (data-add-impresa-verbale, data-rm-impresa-verbale, data-set-ruolo-impresa).
   Il nome del referente si sceglie da un menù a tendina tra i dipendenti dell'impresa (con fallback
   "Altro" a testo libero), stesso meccanismo del Preposto — richiesta 24/09/2026, commento sull'Artifact. */
function wizImpreseRiunione(v){
  const chosenIds = v.impreseCoinvolte.map(x=>x.impresaId);
  const avail = DB.imprese.filter(i=>!chosenIds.includes(i.id));
  const cards = v.impreseCoinvolte.map((ic,idx)=>{
    const candidati = candidatiReferenteImpresa(ic.impresaId);
    const referenteValue = ic.referenteNome||'';
    const candidatoAttuale = candidati.find(p => `${p.nome} ${p.cognome}` === referenteValue);
    const isAltro = !!ic.referenteNomeAltro || (!!referenteValue && !candidatoAttuale);
    const referenteField = candidati.length===0 ? `
      <input type="text" data-referente-nome-idx="${idx}" value="${esc(referenteValue)}" placeholder="Nome e cognome">
      <div class="hint">Nessun dipendente archiviato per questa impresa: qui puoi comunque scrivere il nome a mano, oppure aggiungilo dalla sezione Personale per poterlo scegliere da un elenco.</div>` : `
      <select data-referente-select-idx="${idx}">${
        [`<option value="">Seleziona referente…</option>`]
          .concat(candidati.map(p=>{
            const val = `${p.nome} ${p.cognome}`;
            const label = p.mansione ? `${val} — ${esc(p.mansione)}` : val;
            return `<option value="${esc(val)}" ${val===referenteValue?'selected':''}>${label}</option>`;
          }))
          .concat([`<option value="__altro__" ${isAltro?'selected':''}>✎ Altro (scrivi il nome)</option>`])
          .join('')
      }</select>
      ${isAltro?`<input type="text" data-referente-nome-idx="${idx}" value="${esc(referenteValue)}" placeholder="Nome e cognome del referente" style="margin-top:6px;">`:''}`;
    const presente = ic.presente!==false;
    return `
    <div class="impresa-card">
      <div class="head"><div class="name">${esc(ic.nome)}</div>
        <button class="iconbtn" data-rm-impresa-verbale="${idx}">Rimuovi</button></div>
      <div class="role-select">
        ${IMPRESA_RUOLI.map(r=>`<span class="chip ${ruoliOf(ic).includes(r)?'on':''}" data-set-ruolo-impresa="${idx}" data-ruolo="${r}">${r}</span>`).join('')}
      </div>
      <div class="hint" style="margin-top:4px;">Ruolo dell'impresa nel cantiere — tocca per selezionare uno o più ruoli. È indipendente dalla presenza a questa riunione (sotto).</div>
      <div class="toggle-row" style="margin-top:10px;">
        <div><b>Presente a questa riunione</b></div>
        <label class="switch"><input type="checkbox" data-impresa-presente-idx="${idx}" ${presente?'checked':''}><span class="track"></span><span class="knob"></span></label>
      </div>
      ${presente ? `
      <label style="margin-top:8px;">Referente in riunione</label>
      ${referenteField}
      <label>Mansione del referente</label>
      <input type="text" data-referente-mansione-idx="${idx}" value="${esc(ic.referenteMansione||'')}" placeholder="es. Preposto, Datore di lavoro…">` : `
      <div class="hint" style="margin-top:8px;">Impresa coinvolta nel cantiere ma non presente a questa riunione: nessun referente da indicare qui. Il documento la riporterà comunque tra le imprese coinvolte, senza il riferimento "nella persona di…".</div>`}
    </div>`;
  }).join('') || `<div class="hint">Nessuna impresa selezionata per questo verbale.</div>`;
  const addOpts = avail.map(i=>`<option value="${i.id}">${esc(i.nome)}</option>`).join('');
  return `
  <section class="block">
    <h3>Imprese in questo verbale</h3>
    <div class="hint">Aggiungi qui le imprese coinvolte nel cantiere, col relativo ruolo. Per ciascuna, indica anche se è presente a questa riunione: solo per le imprese presenti va indicato il referente (nome e mansione).</div>
    ${cards}
    ${avail.length?`
    <label>Aggiungi impresa dall'archivio</label>
    <select id="w-add-impresa">${addOpts}</select>
    <button class="btn secondary small" style="margin-top:8px;" data-add-impresa-verbale="1">＋ Aggiungi</button>

/* "Verifica della documentazione consegnata" (Ordine del giorno, verbale di riunione): il nome
   dell'impresa/e va scelto da un menù a tendina tra le imprese già coinvolte nel verbale (passaggio
   "Imprese e referenti"), filtrate per ruolo, invece di essere ridigitato a mano — stesso meccanismo
   già usato per il Preposto nel passaggio "Firme" (richiesta 24/09/2026, commento sull'Artifact).
   Se nessuna impresa coinvolta ha quel ruolo, resta un campo libero con un promemoria. */
function vdocSelectBlock(v, key, label, ruolo){
  const vd = v.ordineGiorno.verificaDoc;
  const value = vd[key]||'';
  const candidati = v.impreseCoinvolte.filter(ic => ruoliOf(ic).includes(ruolo));
  if(candidati.length===0){
    return `
    <label>${label}</label>
    <input type="text" data-og-vdoc-text="${key}" value="${esc(value)}">
    <div class="hint">Nessuna impresa con ruolo "${esc(ruolo)}" tra quelle coinvolte nel passaggio "Imprese e referenti": qui puoi comunque scrivere il nome a mano, oppure torna indietro e aggiungila per poterla scegliere da un elenco.</div>`;
  }
  const isAltro = !!vd[key+'Altro'] || (!!value && !candidati.some(ic=>ic.nome===value));
  const options = [`<option value="">Seleziona impresa…</option>`]
    .concat(candidati.map(ic=>`<option value="${esc(ic.nome)}" ${ic.nome===value?'selected':''}>${esc(ic.nome)}</option>`))
    .concat([`<option value="__altro__" ${isAltro?'selected':''}>✎ Altro (scrivi liberamente)</option>`])
    .join('');
  return `
  <label>${label}</label>
  <select data-og-vdoc-select="${key}">${options}</select>
  ${isAltro?`<input type="text" data-og-vdoc-text="${key}" value="${esc(value)}" style="margin-top:6px;">`:''}`;
}

/* Etichetta di una riga RLS/RLST arricchita col nome dell'impresa scelta (se presente), per il
   documento generato: es. "RLS impresa esecutrice (ProgettoXYZ srl)" invece del solo "RLS impresa
   esecutrice" — utile per distinguere a colpo d'occhio quando ci sono piu' imprese con lo stesso ruolo. */
function rlsLabelConImpresa(r){
  return r.impresaNome ? `${r.label} (${r.impresaNome})` : r.label;

/* Per le righe RLS/RLST di "impresa affidataria"/"impresa esecutrice" (non per quelle del
   committente, che non hanno un'impresa coinvolta corrispondente): l'impresa a cui si riferisce la
   riga si sceglie da un menù a tendina tra quelle coinvolte nel verbale con quel ruolo (passaggio
   "Imprese e referenti"), invece di restare implicita — utile quando ci sono piu' imprese con lo
   stesso ruolo. Stesso meccanismo di vdocSelectBlock() (richiesta 24/09/2026, commento sull'Artifact
   "qua mi devi far selezionare da un menù a tendina le imprese presenti"). */
function rlsImpresaField(v, r, idx){
  if(!r.ruolo) return '';
  const candidati = v.impreseCoinvolte.filter(ic => ruoliOf(ic).includes(r.ruolo));
  const value = r.impresaNome||'';
  if(candidati.length===0){
    return `
    <label style="margin-top:6px;">Impresa (${esc(r.ruolo)})</label>
    <input type="text" data-rls-impresa-text="${idx}" value="${esc(value)}" placeholder="Nome impresa" style="margin-bottom:10px;">
    <div class="hint">Nessuna impresa con ruolo "${esc(r.ruolo)}" tra quelle coinvolte nel passaggio "Imprese e referenti": qui puoi scrivere il nome a mano, oppure torna indietro e aggiungila per poterla scegliere da un elenco.</div>`;
  }
  const isAltro = !!r.impresaAltro || (!!value && !candidati.some(ic=>ic.nome===value));
  const options = [`<option value="">Seleziona impresa…</option>`]
    .concat(candidati.map(ic=>`<option value="${esc(ic.nome)}" ${ic.nome===value?'selected':''}>${esc(ic.nome)}</option>`))
    .concat([`<option value="__altro__" ${isAltro?'selected':''}>✎ Altro (scrivi liberamente)</option>`])
    .join('');
  return `
    <label style="margin-top:6px;">Impresa (${esc(r.ruolo)})</label>
    <select data-rls-impresa-select="${idx}">${options}</select>
    ${isAltro?`<input type="text" data-rls-impresa-text="${idx}" value="${esc(value)}" style="margin-top:6px;margin-bottom:10px;">`:''}`;
}

/* ======================= ANTEPRIMA ======================= */
function validateVerbale(v){
  const errs=[];
  if(!v.cantiereNome) errs.push('Seleziona un cantiere.');
  if(!(v.tipologiaLavoro||'').trim()) errs.push('Indica il tipo di lavorazione del cantiere (scheda Cantiere) — comparirà in copertina.');
  if(!v.data) errs.push('Inserisci la data della visita.');
  if(!v.numero) errs.push('Inserisci il numero del verbale.');
  if(v.impreseCoinvolte.length===0) errs.push('Aggiungi almeno un\'impresa coinvolta.');
  return errs;
}

function presentiPersonaleNomi(v){
  return v.presentiPersonale.map(pid=>{
    const p = DB.personale.find(x=>x.id===pid);
    if(!p) return null;
    const impresa = (v.impreseCoinvolte||[]).find(i=>i.impresaId===p.impresaId);
    const extra = [p.mansione||'', impresa?impresa.nome:''].filter(Boolean).join(' — ');
    return extra ? `${p.nome} ${p.cognome} — ${extra}` : `${p.nome} ${p.cognome}`;
  }).filter(Boolean);
}
/* Elenco "Presenti al momento del sopralluogo" affiancato su più colonne, 4 nominativi per
   colonna (richiesta 09/09/2026, verbale Ponte del passo), invece di un'unica lista verticale. */
function presentiInColonne(items){
  const cols = [];
  for(let i=0;i<items.length;i+=4) cols.push(items.slice(i,i+4));
  return cols;
}
function presentiColonneHtml(items){
  if(!items.length) return '—';
  const cols = presentiInColonne(items);
  return `<div class="doc-presenti-cols">${cols.map(col=>`<div class="doc-presenti-col">${col.join('<br>')}</div>`).join('')}</div>`;
}
function presentiColonneHtmlWord(items){
  if(!items.length) return '—';
  const cols = presentiInColonne(items);
  return `<table style="border-collapse:collapse;"><tr>${cols.map(col=>`<td style="vertical-align:top;padding-right:28px;font-size:12px;">${col.join('<br>')}</td>`).join('')}</tr></table>`;
}
/* Elenco numerato "Presenti al momento del sopralluogo": gli operai/dipendenti (da Personale,
   spuntati come presenti nel passaggio "Presenti") seguiti da "Altri presenti" (CSE, DL,
   committente, ecc. — testo libero), con un'unica numerazione progressiva su tutto l'elenco
   (prima "Altri presenti" non era numerato — richiesta 09/09/2026). */
function presentiNumeratiItems(v){
  const items = [...presentiPersonaleNomi(v), ...(v.altriPresenti||[])];
  return items.map((s,i)=>`${i+1}) ${esc(s)}`);
}

/* ======================= DOCUMENTO STAMPABILE ======================= */
function totalHours(v){
  if(!v.oraArrivoCantiere || !v.oraRedazione) return '';
  const [h1,m1]=v.oraArrivoCantiere.split(':').map(Number);
  const [h2,m2]=v.oraRedazione.split(':').map(Number);
  let mins = (h2*60+m2)-(h1*60+m1);
  if(mins<0) mins+=24*60;
  const h = Math.floor(mins/60), m = mins%60;
  return `${h}h${m?': '+m+'m':''}`;
}
// Come totalHours(), ma per il verbale di riunione: le "ore complessive" (dall'inizio della riunione
// all'ora di redazione del verbale) non si chiedono piu' come valore libero al CSE (richiesta
// 23/09/2026, "le deve stimare in autonomia come fa nei verbali di sopralluogo"), ma si calcolano
// automaticamente allo stesso modo di totalHours().
function totalHoursRiunione(v){
  if(!v.oraInizio || !v.oraRedazione) return '';
  const [h1,m1]=v.oraInizio.split(':').map(Number);
  const [h2,m2]=v.oraRedazione.split(':').map(Number);
  let mins = (h2*60+m2)-(h1*60+m1);
  if(mins<0) mins+=24*60;
  const h = Math.floor(mins/60), m = mins%60;
  return `${h}h${m?': '+m+'m':''}`;
}

/* "Cantiere di" riporta Città (Prov); se comune/provincia non sono compilati si ricade sul nome
   cantiere, per non lasciare il campo vuoto. */
function cantiereCittaProv(v){
  const comune = (v.comune||'').trim(), provincia = provinciaSigla(v.provincia);
  if(!comune) return v.cantiereNome||'';
  return provincia ? `${comune} (${provincia})` : comune;
}
function cantiereCoverLabel(v){
  const cittaProv = cantiereCittaProv(v);
  const sito = (v.sito||'').trim();
  return [cittaProv, sito].filter(Boolean).join(' - ');
}
function docFileBaseName(v){
  const prefix = v.tipo==='riunione' ? 'VerbaleRiunione' : 'Verbale';
  return `${prefix}_n${v.numero}-${v.anno}_${(v.cantiereNome||'cantiere').replace(/[^a-z0-9]+/gi,'_')}`;
}

function docFooter(n, total, allegatoCode){
  return `<div class="doc-footer"><div class="l">${DOC_ITG_CODE}<br>${allegatoCode||DOC_ALLEGATO_CODE}</div><div class="r">Pagina ${n} di ${total}</div></div>`;
}

    <span class="doc-u">${esc(String(v.numero))}</span> / <span class="doc-u">${esc(String(v.anno))}</span>`;

  const impreseChkHtml = impresaFixedRows(v.impreseCoinvolte);

  const attivitaTable = `

    <tr class="bar-row"><td colspan="3">ATTIVITA'</td></tr>
    <tr><td>Arrivo in cantiere ed inizio sopralluogo</td><td class="h">h</td><td class="v">${v.oraArrivoCantiere||'—'}</td></tr>
    <tr><td>Fine sopralluogo e partenza per la sede aziendale</td><td class="h">h</td><td class="v">${v.oraFineSopralluogo||'—'}</td></tr>
    <tr><td>Arrivo in sede aziendale</td><td class="h">h</td><td class="v">${v.oraArrivoSede||'—'}</td></tr>
    <tr><td>In data ${fmtDate(v.data)}: redazione verbale di sopralluogo</td><td class="h">h</td><td class="v">${v.oraRedazione||'—'}</td></tr>
    <tr class="tot"><td>Per complessive</td><td class="h">h</td><td class="v">${totalHours(v)||'—'}</td></tr>
  </table>`;

  const commRlHtml = `<div class="doc-cols2-plain">
    <div><b>Committente:</b> <span class="doc-u">${esc(v.committente)||'—'}</span></div>
    <div><b>Responsabile Lavori:</b> <span class="doc-u">${esc(v.responsabileLavori)||'—'}</span></div>
  </div>`;

  const presentiListHtml = presentiColonneHtml(presentiNumeratiItems(v));
  const presentiBoxHtml = `<div class="doc-box" style="font-size:12px;line-height:1.5;"><b>Presenti al momento del sopralluogo</b><br>${presentiListHtml||'—'}<br><br><b>il CSE</b> <span class="doc-u">${esc(v.cse)||'—'}</span></div>`;

  const fasiFotoHtml = v.fotoFasi.length ? `<div class="doc-photogrid fasi-fixed">${v.fotoFasi.map(p=>`<div class="p"><img src="${p.img}"><div class="c">${esc(p.caption)}</div></div>`).join('')}</div>` : '';

  const visitaPage = `
  <div class="doc-page">
    ${docLogoImg()}
    <div class="doc-visita-wrap">
      <div class="doc-visita-tag">VISITA</div>
      <div class="doc-visita-fields">${visitaFieldsHtml}</div>
    </div>
    <div class="doc-box-line"><b>Cantiere di:</b> <span class="doc-u">${esc(cantiereCittaProv(v))}</span> &nbsp;&nbsp; <b>Sito in:</b> <span class="doc-u">${esc(v.sito)}</span></div>
    ${attivitaTable}
    <div class="doc-box">
      ${commRlHtml}
      <div class="doc-chk-list" style="margin:0;">${impreseChkHtml}</div>
    </div>
    ${presentiBoxHtml}
    ${v.fotoFasi.length ? `<div class="doc-bar">Fasi di lavoro in atto</div>${fasiFotoHtml}` : ''}
    ${docFooter(nextPage(), totalPages)}
  </div>`;

  /* ---- osservanze: TRE pagine dedicate per impresa (NOTE / OSSERVANZE / PRESCRIZIONI), ciascuna
     spezzabile in più pagine fisiche (fino a 3) se il contenuto non entra — vedi paginateOsservanzePage()
     più sotto — la numerazione pagina/totale viene ricalcolata a parte ---- */
  const ossHtml = v.osservanze.map(o=>{
    const impresa = v.impreseCoinvolte.find(i=>i.impresaId===o.impresaId);
    const impresaNome = esc(impresa?impresa.nome:'');
    const frasiByCat = cat => DB.frasi.filter(f=>o.selFrasi.includes(f.id) && f.categoria===cat)
      .map(f=>`<div class="doc-phrase">${esc(f.testo)}</div>`).join('');
    const prescr = DB.frasi.filter(f=>o.selPrescrizioni.includes(f.id))
      .map(f=>`<div class="doc-phrase">${esc(f.testo)}</div>`).join('');
    const fotoHtml = o.foto.length ? `<div class="doc-photogrid fasi-fixed">${o.foto.map(p=>`<div class="p"><img src="${p.img}"><div class="c">${esc(p.caption)}</div></div>`).join('')}</div>` : '';

    const noteBody = frasiByCat('standard')+(o.noteLibere?`<div class="doc-phrase">${esc(o.noteLibere)}</div>`:'');
    const daAggBody = frasiByCat('daAggiungere');
    /* Note specifiche CSE + foto: riquadro proprio, mostrato solo quando c'è davvero qualcosa da
       racchiudere (frasi "note specifiche", testo libero o foto) — richiesta 09/09/2026, verbale
       Ponte del passo. È un blocco unico e indivisibile ai fini dell'impaginazione automatica
       (vedi data-oss-flow="notespec" e paginateOsservanzePage() più sotto). */
    const noteSpecContent = frasiByCat('noteSpecifiche')+(o.noteSpecificheLibere?`<div class="doc-phrase">${esc(o.noteSpecificheLibere)}</div>`:'');
    const noteSpecBoxHtml = (noteSpecContent || o.foto.length) ? `<div class="doc-box" data-oss-flow="notespec">${noteSpecContent}${fotoHtml}</div>` : '';
    const prescrBody = prescr+(o.prescrizioniLibere?`<div class="doc-phrase">${esc(o.prescrizioniLibere)}</div>`:'');
    const dedicatedPage = (barLabel, body, extraHtml) => `
    <div class="doc-page" data-oss-page="1" data-oss-impresa="${impresaNome}">
      ${docLogoImg()}
      <div class="doc-bar">${barLabel}</div>
      <div class="doc-chk-list boxed">${targetChk}</div>
      <div class="doc-box" data-oss-textbox="1">${body || '<div class="doc-phrase">—</div>'}</div>
      ${extraHtml||''}
      ${docFooter(nextPage(), totalPages)}
    </div>`;
    return dedicatedPage('NOTE', noteBody, '')
      + dedicatedPage('OSSERVANZE', daAggBody, noteSpecBoxHtml)
      + dedicatedPage(`PRESCRIZIONI: ${impresaNome}`, prescrBody, '');
  }).join('');

  /* ---- sospensione: always present, crossed out when not attiva ---- */
  const s = v.sospensione;
  const susContro = IMPRESA_RUOLI.map(r=>chkRow(s.contro.includes(r), r)).join('');
  const susEsitoHtml =
    s.esito==='approva' ? chkRow(true,'Il CSE approva') + chkRow(false,'Il CSE approva con le seguenti prescrizioni') + chkRow(false,'Il CSE respinge la proposta')
    : s.esito==='approvaConPrescrizioni' ? chkRow(false,'Il CSE approva') + chkRow(true,'Il CSE approva con le seguenti prescrizioni: '+(esc(s.prescrizioniTesto)||'—')) + chkRow(false,'Il CSE respinge la proposta')
    : s.esito==='respinge' ? chkRow(false,'Il CSE approva') + chkRow(false,'Il CSE approva con le seguenti prescrizioni') + chkRow(true,'Il CSE respinge la proposta per i seguenti motivi: '+(esc(s.motivoRespinta)||'—')+(s.entroData?` — nuova proposta entro il ${fmtDate(s.entroData)}`:''))
    : chkRow(false,'Il CSE approva') + chkRow(false,'Il CSE approva con le seguenti prescrizioni') + chkRow(false,'Il CSE respinge la proposta');
  const suspFotoHtml = (s.fotoFase&&s.fotoFase.length) ? `<div class="doc-photogrid fasi-fixed">${s.fotoFase.map(p=>`<div class="p"><img src="${p.img}"><div class="c">${esc(p.caption)}</div></div>`).join('')}</div>` : '';
  const suspRipristinoHtml = (s.fotoRipristino&&s.fotoRipristino.length) ? `<div class="doc-photogrid fasi-fixed">${s.fotoRipristino.map(p=>`<div class="p"><img src="${p.img}"><div class="c">${esc(p.caption)}</div></div>`).join('')}</div>` : '';

  const suspBlockHtml = `
    <div class="doc-bar" style="margin-bottom:0;">SOSPENSIONE DEI LAVORI per pericolo grave, imminente e direttamente riscontrato</div>
    <div class="doc-box doc-susp-box" style="border-top:none;">
      <div style="font-size:12px;margin-bottom:6px;"><b>nei confronti di:</b></div>
      <div class="doc-chk-list">${susContro}</div>
      <div style="font-size:12px;margin:10px 0 4px;"><b>A) Descrizione sintetica della fase/sottofase sospesa e motivazione:</b></div>
      <div style="font-size:12px;margin-bottom:8px;">${esc(s.descrizione)||'—'}</div>
      ${suspFotoHtml}
      <div style="font-size:12px;margin:10px 0 4px;"><b>Proposta di intervento per il ripristino in sicurezza:</b></div>
      <div style="font-size:12px;margin-bottom:8px;">${esc(s.propostaTesto)||'—'}</div>
      <div style="font-size:12px;margin:10px 0 4px;"><b>Esito CSE:</b></div>
      ${susEsitoHtml}
      <div style="font-size:12px;margin:12px 0 4px;"><b>Esito della verifica degli avvenuti adeguamenti:</b></div>
      ${chkRow(s.verificaAvvenuta, "il pericolo grave, imminente e direttamente riscontrato è stato eliminato (come evidenziato nelle sottostanti fotografie)")}
      ${suspRipristinoHtml}
      ${!s.attiva ? `<svg class="doc-susp-diag" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="2" y1="2" x2="98" y2="98" stroke="#000" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>` : ''}
    </div>`;

  /* ---- firme + distribuzione ---- */
  const destRows = DB.destinatari.filter(d=>v.destinatariSelezionati.includes(d.id))
    .map(d=>chkRow(true, `Sig. <span class="doc-u">${esc(d.nome)}</span>${d.ruolo?' - '+esc(d.ruolo):''}${d.email?' &nbsp; e-mail '+esc(d.email):''}`))
    .join('') || `<div style="font-size:12px;color:var(--muted);">Nessun destinatario selezionato.</div>`;

  const invioHtml = chkInline(v.modalitaInvio.email,'e-mail') + chkInline(v.modalitaInvio.fax,'via fax') + chkInline(v.modalitaInvio.brevimano,'via WhatsApp / app');

  const firmeHtml = `
    <div class="doc-signatures">
      ${docSigLine('Il coordinatore della sicurezza<br>in fase di esecuzione', v.cse, v.firmaCSEImg)}
      ${v.assistenteCSE?docSigLine('Assistente CSE', v.assistenteCSE, v.assistenteCSEImg):''}
      ${v.impreseCoinvolte.map(i=>docSigLine('Preposto — '+esc(i.nome), i.preposto, i.firmaPrepostoImg)).join('')}
      ${v.firmaExtra && v.firmaExtra.nome?docSigLine(esc(v.firmaExtra.label||'Altra firma'), v.firmaExtra.nome, v.firmaExtra.img):''}
    </div>`;

  /* sospensione e firme/distribuzione condividono la stessa pagina finale */
  const lastPage = `
  <div class="doc-page">
    ${docLogoImg()}
    ${suspBlockHtml}
    <div class="doc-bar" style="line-height:1.4;margin-top:16px;">Quanto contenuto nel presente rapporto costituisce adempimento degli obblighi dell'art. 92, comma 1, e aggiornamento del PSC e dei POS delle imprese affidataria ed esecutrici.</div>
    ${firmeHtml}

    <div class="doc-chk-list" style="margin-top:8px;">${destRows}</div>

  </div>`;

  const doc = `
  <div id="docview">
    ${coverPage}

    ${ossHtml}

  return `
  <div class="topbar no-print"><button class="back" data-go="anteprima">‹</button><h1>Verbale generato</h1></div>

    <div class="preview-sec">

        <button class="btn ghost" data-go="archivio">Vai all'archivio</button>
      </div>
    </div>
  </div>
  ${doc}
  `;
}

/* Documento stampabile del verbale di riunione iniziale di coordinamento (Allegato 8) — analogo a
   viewDocumento() (Allegato 10) ma con 5 pagine fisse (dal 24/09/2026: "Verifiche del CSE" e
   "Rappresentanti per la sicurezza" hanno ciascuna una pagina propria, prima condividevano la
   stessa pagina 3 e il contenuto risultava troppo denso) invece della paginazione dinamica per
   foto/osservanze (questo tipo di verbale non ha foto né osservanze per impresa). Il corposo testo
   fisso a carattere legale/normativo del modello di riferimento è riportato qui come testo fisso —
   vedi nota sopra wizIncontro() per la motivazione di questa scelta. */
function viewDocumentoRiunione(){
  const v = CURRENT_VERBALE;
  const totalPages = 5;
  let pageNo = 0;
  const nextPage = () => ++pageNo;
  const foot = (n) => docFooter(n, totalPages, DOC_ALLEGATO_CODE_RIUNIONE);

  /* ---- pagina 1: copertina ---- */
  const coverPage = `
  <div class="doc-page">
    ${docLogoImg()}
    <div class="doc-cover-wrap">
      <div class="doc-cover-title">
        <div class="l1">Allegato ${esc(DOC_ALLEGATO_NUM_RIUNIONE)}</div>
        <div class="l2">VERBALE RIUNIONE INIZIALE DI COORDINAMENTO</div>
      </div>
      <div class="doc-cover-box">${esc([v.tipologiaLavoro, cantiereCoverLabel(v)].filter(Boolean).join(' ').toUpperCase())}</div>
    </div>
    ${foot(nextPage())}
  </div>`;

  /* ---- pagina 2: dati riunione, imprese/referenti, presenti, ordine del giorno ---- */
  const [dY,dM,dD] = (v.data||'').split('-');
  const riunioneFieldsHtml = `
    ${chkInline(true,'del')}
