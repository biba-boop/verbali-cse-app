<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* Font usati SOLO dalla schermata "Aggiornamento in corso" (vedi .update-screen più sotto),
     riprodotta identica al mockup fornito da GDG STUDIO: il resto dell'app usa il font di sistema
     e non è toccato da questo import. Se il dispositivo è offline il font non si carica e si vede
     comunque il resto della pagina, grazie al fallback impostato su ogni regola che lo usa. */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap');
  :root{
    --navy:#008c15;
    --navy-dark:#005e0e;
    --navy-pale:#e6f5e8;
    --green:#3a7d52;
    --green-bg:#e9f5ec;
    --blue:#2f6fa8;
    --blue-bg:#eaf3fb;
    --red:#b03a3a;
    --red-bg:#faeaea;
    --amber:#a3711b;
    --amber-bg:#fbf1e2;
    --ink:#22303f;
    --muted:#5b6b7c;
    --line:#d7dee6;
    --paper:#ffffff;
    --bg:#f3f5f8;
    --doc-navy:#183C70;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;}
  #app{max-width:720px;margin:0 auto;min-height:calc(100vh - var(--hdr-h, 68px));min-height:calc(100dvh - var(--hdr-h, 68px));background:var(--bg);
    padding-bottom:calc(90px + env(safe-area-inset-bottom));}

  .brand-header{position:sticky;top:0;z-index:21;background:#fff;border-bottom:1px solid var(--line);
    max-width:720px;margin:0 auto;padding:calc(7px + env(safe-area-inset-top)) 14px 7px;
    display:flex;align-items:center;gap:8px;}
  .brand-spacer{flex:0 0 0;}
  .brand-logo-wrap{flex:1;min-width:0;display:flex;justify-content:flex-start;}
  .brand-header img{height:34.04px;width:auto;display:block;}
  .brand-header.centered .brand-spacer{flex:0 0 112px;}
  .brand-header.centered .brand-logo-wrap{justify-content:center;}
  .brand-header.centered img{height:47.7px;}
  .profile-badge{flex:0 0 112px;width:112px;overflow:hidden;display:flex;visibility:hidden;
    align-items:center;gap:5px;background:var(--bg);
    border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 3px;font-size:10.5px;
    font-weight:700;color:var(--navy-dark);cursor:pointer;font-family:inherit;
    text-transform:uppercase;letter-spacing:.3px;}
  .profile-badge:active{background:var(--navy-pale);}
  .profile-badge .avatar{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;
    text-transform:none;}
  .profile-badge .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .topbar{position:sticky;top:var(--hdr-h, 68px);z-index:20;background:var(--navy);color:#fff;
    display:flex;align-items:center;gap:10px;padding:14px 14px;min-height:26px;}
  .topbar button.back{background:none;border:none;color:#fff;font-size:22px;line-height:1;
    padding:2px 6px;cursor:pointer;border-radius:6px;}
  .topbar button.back:active{background:rgba(255,255,255,.15);}
  .topbar button.save-draft{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;font-size:12.5px;
    font-weight:600;line-height:1;padding:6px 10px;cursor:pointer;border-radius:20px;white-space:nowrap;
    display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .topbar button.save-draft:active{background:rgba(255,255,255,.15);}
  .topbar h1{font-size:16px;margin:0;font-weight:600;flex:1;letter-spacing:.2px;min-width:0;}
  .topbar .sub{font-size:11px;opacity:.75;display:block;font-weight:400;margin-top:1px;}

  .content{padding:14px;}
  .home-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);
    color:#fff;border-radius:var(--radius);padding:22px 18px;margin-bottom:16px;}
  .home-hero h2{margin:0 0 4px;font-size:20px;}
  .home-hero p{margin:0;font-size:13px;opacity:.85;line-height:1.5;}

  .grid-menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .menu-btn{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;
    box-shadow:0 1px 2px rgba(20,40,60,.05);}
  .menu-btn:active{background:#eef1f5;}
  .menu-btn .ico{font-size:22px;}
  .menu-btn .lbl{font-size:14px;font-weight:600;color:var(--navy-dark);}
  .menu-btn .cnt{font-size:11px;color:var(--muted);}
  .menu-btn.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;}
  .menu-btn.primary{background:var(--navy);border-color:var(--navy);}
  .menu-btn.primary .ico,.menu-btn.primary .lbl,.menu-btn.primary .cnt{color:#fff;}
  .menu-btn.primary .cnt{opacity:.8;}

  section.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:12px;}
  .block h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:6px;}

  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=date],input[type=time],input[type=email],input[type=number],textarea,select{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:16px;
    background:#fff;color:var(--ink);font-family:inherit;}
  textarea{min-height:70px;resize:vertical;line-height:1.4;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .row3 label{font-size:11px;margin:10px 0 3px;}
  .row3 select{font-size:12.5px;padding:6px 6px;min-height:36px;}
  .hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--navy);color:#fff;border:none;border-radius:8px;padding:12px 16px;
    font-size:14px;font-weight:600;cursor:pointer;width:100%;}
  .btn:active{background:var(--navy-dark);}
  .btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--navy);}
  .btn.secondary:active{background:var(--navy-pale);}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn.danger{background:#fff;color:var(--red);border:1px solid var(--red);}
  .btn.small{padding:8px 12px;font-size:13px;width:auto;}
  .btn:disabled{opacity:.45;}
  .btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .btn-row .btn{flex:1;min-width:130px;}

  .chip-list{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13px;
    background:#fff;cursor:pointer;color:var(--ink);}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}

  .item-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 4px;border-bottom:1px solid var(--line);}
  .item-row:last-child{border-bottom:none;}
  .item-row .main{flex:1;min-width:0;}
  .item-row .main .t{font-size:14px;font-weight:600;color:var(--ink);}
  .item-row .main .s{font-size:12px;color:var(--muted);margin-top:2px;}
  .item-row .actions{display:flex;gap:6px;flex-shrink:0;}
  .iconbtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px;
    font-size:13px;cursor:pointer;color:var(--navy);}

  .empty{text-align:center;padding:34px 14px;color:var(--muted);}
  .empty .ico{font-size:30px;margin-bottom:8px;}
  .empty p{margin:0;font-size:13px;line-height:1.5;}

  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));max-width:692px;width:calc(100% - 28px);z-index:30;}

  .phrase-cat{border-radius:8px;padding:10px 12px;margin-bottom:10px;}
  .phrase-cat.standard{background:var(--green-bg);border-left:4px solid var(--green);}
  .phrase-cat.daAggiungere{background:var(--blue-bg);border-left:4px solid var(--blue);}
  .phrase-cat.noteSpecifiche{background:var(--red-bg);border-left:4px solid var(--red);}
  .phrase-cat.prescrizioni{background:var(--amber-bg);border-left:4px solid var(--amber);}
  .phrase-cat.riunione{background:var(--blue-bg);border-left:4px solid var(--blue);}
  .phrase-cat.riunione .cat-title{color:var(--blue);}
  .phrase-cat .cat-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;
    cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .phrase-cat .cat-title::-webkit-details-marker{display:none;}
  .phrase-cat .cat-title::after{content:'▾';font-size:10px;flex-shrink:0;transition:transform .15s;}
  .phrase-cat:not([open]) .cat-title{margin-bottom:0;}
  .phrase-cat:not([open]) .cat-title::after{transform:rotate(-90deg);}
  .phrase-cat.standard .cat-title{color:var(--green);}
  .phrase-cat.daAggiungere .cat-title{color:var(--blue);}
  .phrase-cat.noteSpecifiche .cat-title{color:var(--red);}
  .phrase-cat.prescrizioni .cat-title{color:var(--amber);}
  /* Libreria fasi di lavoro: stesse 4 varianti colorate della Libreria osservanze (richiesta 23/09/2026
     "usa lo stesso stile delle osservazioni"), ma con classi proprie (fasi-c1..fasi-c4) invece di
     riusare standard/daAggiungere/noteSpecifiche/prescrizioni, per non far scattare per errore anche
     il listener/lo stato "a tendina" delle categorie di Osservanze (chiave condivisa per nome classe). */
  .phrase-cat.fasi-c1{background:var(--green-bg);border-left:4px solid var(--green);}
  .phrase-cat.fasi-c1 .cat-title{color:var(--green);}
  .phrase-cat.fasi-c2{background:var(--blue-bg);border-left:4px solid var(--blue);}
  .phrase-cat.fasi-c2 .cat-title{color:var(--blue);}
  .phrase-cat.fasi-c3{background:var(--red-bg);border-left:4px solid var(--red);}
  .phrase-cat.fasi-c3 .cat-title{color:var(--red);}
  .phrase-cat.fasi-c4{background:var(--amber-bg);border-left:4px solid var(--amber);}
  .phrase-cat.fasi-c4 .cat-title{color:var(--amber);}
  /* Libreria note riunioni: 6 categorie fisse (richiesta 24/09/2026 via commento sull'Artifact,
     "suddividi e crea 6 categorie..."), stesso meccanismo a rotazione di colore di fasi-c1..c4
     (solo 4 tinte disponibili per 6 categorie), ma con classi proprie (riu-c1..riu-c4) per lo stesso
     motivo di fasi-c1..c4 sopra: non far scattare per errore lo stato "a tendina" di altre librerie. */
  .phrase-cat.riu-c1{background:var(--green-bg);border-left:4px solid var(--green);}
  .phrase-cat.riu-c1 .cat-title{color:var(--green);}
  .phrase-cat.riu-c2{background:var(--blue-bg);border-left:4px solid var(--blue);}
  .phrase-cat.riu-c2 .cat-title{color:var(--blue);}
  .phrase-cat.riu-c3{background:var(--red-bg);border-left:4px solid var(--red);}
  .phrase-cat.riu-c3 .cat-title{color:var(--red);}
  .phrase-cat.riu-c4{background:var(--amber-bg);border-left:4px solid var(--amber);}
  .phrase-cat.riu-c4 .cat-title{color:var(--amber);}
  /* nome categoria elastico (flex:1): cosi' il conteggio "(N voci)" che lo segue resta sempre alla
     stessa posizione, allineato tra tutte le categorie invece di seguire subito un nome più corto
     o più lungo (richiesta 23/09/2026: "non è allineato con le altre categorie"). */
  .fasi-cat-name{flex:1 1 0%;min-width:0;}
  .phrase-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px solid rgba(0,0,0,.06);}
  .phrase-item:first-of-type{border-top:none;}
  .phrase-item input[type=checkbox]{margin-top:3px;flex-shrink:0;width:18px;height:18px;}
  .phrase-item .txt{font-size:13px;line-height:1.45;flex:1;}
  .phrase-item .del{flex-shrink:0;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 4px;}

  .stepper{display:flex;gap:4px;padding:10px 14px 0;}
  .stepper .dot{flex:1;height:4px;border-radius:2px;background:var(--line);}
  .stepper .dot.done{background:var(--navy);}
  .stepper .dot.active{background:var(--blue);}
  .step-label{padding:6px 14px 0;font-size:12px;color:var(--muted);}

  .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .photo-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;}
  .photo-card img{width:100%;height:110px;object-fit:cover;display:block;background:#eee;}
  .photo-card .cap{padding:6px 8px;}
  .photo-card .cap input{font-size:12px;padding:6px 7px;}
  .photo-card .fase-pick{padding:6px 8px 0;display:flex;flex-direction:column;gap:5px;}
  .photo-card .fase-pick select{font-size:12px;padding:6px 7px;min-height:34px;}
  .photo-card .actions{display:flex;border-top:1px solid var(--line);}
  .photo-card .actions .retake{flex:1;border:none;border-right:1px solid var(--line);background:#fff;color:var(--muted);
    font-size:12px;padding:6px;cursor:pointer;text-align:center;}
  .photo-card .actions .rm{flex:1;width:auto;border:none;background:#fff;color:var(--red);
    font-size:12px;padding:6px;cursor:pointer;}
  .add-photo-btn{border:2px dashed var(--line);border-radius:8px;background:#fafbfc;color:var(--muted);
    padding:22px 10px;text-align:center;font-size:13px;cursor:pointer;}

  .sig-pad-wrap{margin:8px 0 16px;}
  .sig-canvas-box{position:relative;}
  .sig-canvas{width:100%;height:140px;border:1px dashed var(--line);border-radius:8px;background:#fff;
    touch-action:none;display:block;cursor:crosshair;}
  .sig-canvas-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:10px;font-size:13px;font-weight:600;color:var(--muted);
    background:rgba(255,255,255,.82);border:1px dashed var(--line);border-radius:8px;
    cursor:pointer;touch-action:pan-y;}
  .sig-preview{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px;margin-bottom:6px;
    display:flex;justify-content:center;}
  .sig-preview img{max-width:220px;max-height:90px;display:block;}

  .import-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0;border-top:1px solid rgba(0,0,0,.06);}
  .import-row:first-of-type{border-top:none;}
  .import-row input[type=text]{flex:1 1 110px;min-width:0;font-size:13px;padding:8px 9px;}
  .import-row .iconbtn{flex-shrink:0;}
  .import-count{font-size:12px;color:var(--muted);margin:6px 0 10px;}

  .impresa-card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;}
  .impresa-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .impresa-card .head .name{font-weight:700;font-size:14px;}
  .role-select{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}

  .personale-check{display:flex;align-items:center;gap:8px;padding:6px 0;}
  .personale-check input{width:18px;height:18px;flex-shrink:0;}
  .personale-check .lbl{font-size:13px;}
  .personale-check .lbl small{color:var(--muted);display:block;font-size:11px;}

  .pers-group{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden;background:#fff;}
  .pers-group summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;align-items:center;
    justify-content:space-between;gap:10px;background:var(--navy-pale);}
  .pers-group summary::-webkit-details-marker{display:none;}
  .pers-group summary .name{font-size:13px;font-weight:700;color:var(--navy-dark);}
  .pers-group summary .cnt{font-size:11px;color:var(--muted);font-weight:600;margin-left:4px;}
  .pers-group summary .arrow{font-size:11px;color:var(--muted);transition:transform .15s;flex-shrink:0;}
  .pers-group[open] summary .arrow{transform:rotate(90deg);}
  .pers-group .pers-body{padding:8px 12px 10px;}
  .pers-group .pers-body .item-row:first-child{border-top:none;}
  .pers-filtered-hint{padding:6px 0;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
  .switch{position:relative;width:44px;height:26px;flex-shrink:0;}
  .switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1;}
  .switch .track{position:absolute;inset:0;background:var(--line);border-radius:14px;transition:.15s;}
  .switch input:checked ~ .track{background:var(--navy);}
  .switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
    transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch input:checked ~ .knob{transform:translateX(18px);}

  /* ---- schermata "Aggiornamento in corso" (modalità aggiornamento) ----
     Riprodotta identica al mockup GDG STUDIO fornito (colori/font/testi propri, distinti dal tema
     verde #008c15 del resto dell'app). Unica differenza voluta: niente cornice "a telefono" con
     orologio finto, perché qui l'app gira nel browser reale, non in un'anteprima. */
  .update-screen{--upd-ink:#111312;--upd-green:#1F7A34;--upd-green-deep:#155726;--upd-green-tint:#E7F3E9;
    --upd-paper:#FBFBFA;--upd-grey:#6C716D;
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom));background:var(--upd-paper);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .update-card{width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;align-items:center;
    padding:6px 34px 30px;}
  .update-logo{width:100%;max-width:297px;height:auto;margin:34px 0 0;}
  .update-scene{width:100%;display:flex;align-items:center;justify-content:center;margin:10px 0 4px;}
  .update-copy{text-align:center;width:100%;}
  .update-card h1{font-family:'Space Grotesk','Inter',sans-serif;font-weight:600;font-size:23px;
    line-height:1.25;color:var(--upd-ink);margin:0 0 10px;}
  .update-sub{font-size:14px;line-height:1.55;color:var(--upd-grey);margin:0 0 26px;}
  .update-progress-block{width:100%;margin-bottom:22px;}
  .update-progress-track{position:relative;width:100%;height:10px;border-radius:6px;background:var(--upd-green-tint);
    overflow:hidden;border:1px solid rgba(17,19,18,.06);}
  .update-progress-fill{position:absolute;inset:0;width:38%;border-radius:6px;
    background:repeating-linear-gradient(-45deg, var(--upd-green) 0px, var(--upd-green) 9px, var(--upd-ink) 9px, var(--upd-ink) 18px);
    background-size:200% 100%;animation:updFillgrow 4.2s ease-in-out infinite, updStripes 1.1s linear infinite;}
  @keyframes updFillgrow{0%{width:12%;}50%{width:78%;}100%{width:12%;}}
  @keyframes updStripes{0%{background-position:0 0;}100%{background-position:-36px 0;}}
  .update-progress-labels{display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;
    color:var(--upd-grey);font-weight:500;}
  .update-progress-labels .b{color:var(--upd-ink);font-weight:600;}
  .update-note{font-size:12.5px;color:var(--upd-grey);line-height:1.5;margin:0 0 22px;}
  .update-note strong{color:var(--upd-ink);font-weight:600;}
  .update-notify-btn{width:100%;padding:14px 0;border-radius:10px;border:1.5px solid var(--upd-ink);
    background:transparent;color:var(--upd-ink);font-family:'Inter',sans-serif;font-weight:600;
    font-size:14.5px;cursor:pointer;}
  .update-notify-btn[disabled]{opacity:.6;cursor:default;}
  .update-notify-hint{font-size:11.5px;color:var(--upd-grey);line-height:1.5;margin-top:10px;}
  .update-foot{margin-top:14px;font-size:11px;color:var(--upd-grey);}
  .update-foot span{color:var(--upd-green);font-weight:600;}
  .upd-crane-arm{transform-origin:138px 46px;animation:updSway 5.5s ease-in-out infinite;}
  @keyframes updSway{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-4.5deg);}}
  .upd-hook{transform-origin:92px 46px;animation:updSwayhook 5.5s ease-in-out infinite;}
  @keyframes updSwayhook{0%,100%{transform:rotate(0deg) translateY(0px);}50%{transform:rotate(-4.5deg) translateY(2px);}}
  .upd-block{animation:updBlockmove 4.2s ease-in-out infinite;}
  @keyframes updBlockmove{0%{transform:translateY(0px);opacity:1;}40%{transform:translateY(46px);opacity:1;}
    55%{transform:translateY(46px);opacity:1;}95%{transform:translateY(46px);opacity:0;}
    96%{transform:translateY(0px);opacity:0;}100%{transform:translateY(0px);opacity:1;}}
  .upd-fill-rect{animation:updRisefill 4.2s ease-in-out infinite;}
  @keyframes updRisefill{0%{height:14px;y:150px;}50%{height:118px;y:46px;}100%{height:14px;y:150px;}}

  .toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--navy-dark);
    color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.25);
    opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 40px);text-align:center;}
  .toast.show{opacity:1;}

  .errlist{background:var(--red-bg);border:1px solid var(--red);border-radius:8px;padding:10px 12px;margin-bottom:12px;}
  .errlist .t{color:var(--red);font-weight:700;font-size:13px;margin-bottom:4px;}
  .errlist li{font-size:12px;color:var(--ink);margin-left:16px;}

  .preview-sec{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;}
  .preview-sec h4{margin:0 0 8px;font-size:12px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;}
  .preview-sec .kv{display:flex;font-size:13px;padding:3px 0;gap:6px;}
  .preview-sec .kv .k{color:var(--muted);flex-shrink:0;min-width:130px;}
  .preview-sec .kv .v{font-weight:600;}
  .preview-sec .edit-link{font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;padding:0;}

  .spinner-overlay{position:fixed;inset:0;background:rgba(18,40,63,.55);display:flex;align-items:center;
    justify-content:center;z-index:200;color:#fff;font-size:14px;flex-direction:column;gap:10px;}
  .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;
    animation:spin .8s linear infinite;}

  /* conferma di eliminazione rinforzata (richiesta 23/09/2026): al posto del semplice confirm()
     del browser, una finestra che obbliga a digitare una parola prima di poter eliminare davvero.
     Creata/rimossa via JS (vedi confirmEliminaConTesto), non fa parte del ciclo render(). */
  .confirm-modal-overlay{position:fixed;inset:0;background:rgba(18,40,63,.55);display:flex;
    align-items:center;justify-content:center;z-index:210;padding:20px;}
  .confirm-modal-box{background:#fff;border-radius:var(--radius);padding:18px;max-width:340px;
    width:100%;box-shadow:0 8px 30px rgba(0,0,0,.35);}
  .confirm-modal-box .confirm-modal-msg{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--ink);line-height:1.4;}
  .confirm-modal-box .confirm-modal-hint{margin:0 0 8px;font-size:12.5px;color:var(--muted);line-height:1.4;}
  .confirm-modal-box .confirm-modal-hint b{color:var(--red);}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== printable document — matches the official Italgas Reti
     "Allegato 10" verbale template (logo, colors, layout) ===== */
  #docview{display:none;}
  /* page box + margins measured from the source .docx sectPr/pgMar (A4, top=1440 right=1124 bottom=0 left=920 twips @96dpi).
     display:flex column + min-height:full A4 height + footer margin-top:auto keeps the footer pinned to the
     bottom of every printed/exported page regardless of how much content precedes it. */
  .doc-page{background:#fff;max-width:794px;min-height:1123px;margin:0 auto 18px;padding:96px 75px 16px 61px;
    border:1px solid var(--line);border-radius:6px;font-size:12px;line-height:1.5;color:#111;position:relative;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
    display:flex;flex-direction:column;}
  /* logo pulled toward the physical top-left corner of the sheet on every page (same position as
     page 1), bleeding past the body margin — matches the negative anchor offsets measured in the source docx */
  .doc-logo-row{margin:-73px 0 16px -35px;}
  /* logo placed at native, unscaled size (208x88px = 1983740x836930 EMU) on every single page in the source docx */
  .doc-logo-img{height:88px;width:208px;object-fit:contain;display:block;}
  .doc-bar{background:var(--doc-navy);color:#fff;font-weight:700;padding:7px 12px;margin:12px 0 10px;
    font-size:15px;}
  .doc-bar .sub{font-weight:400;font-style:italic;font-size:15px;}
  .doc-box{border:1px solid #000;padding:10px 12px;margin-bottom:10px;}
  .doc-box-line{font-size:12px;margin-bottom:10px;border:1px solid #000;padding:8px 10px;}
  .doc-u{border-bottom:1px solid #000;padding:0 4px;font-weight:600;color:var(--doc-navy);}
  .doc-cols2-plain{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:12px;margin-bottom:10px;}
  .doc-presenti-cols{display:flex;flex-wrap:wrap;gap:2px 28px;}
  .doc-presenti-col{line-height:1.5;}
  .doc-photogrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;}
  .doc-photogrid .p img{width:100%;height:90px;object-fit:cover;border:1px solid var(--line);border-radius:3px;}
  .doc-photogrid .p .c{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3;}
  /* fasi di lavoro / osservanze / adeguamenti photos: dimensione fissa 4cm x 5,33cm, 3 per riga — almeno 6 foto (2 righe) ci stanno */
  .doc-photogrid.fasi-fixed{grid-template-columns:repeat(3, 5.33cm);gap:6px;}
  .doc-photogrid.fasi-fixed .p img{height:4cm;}
  /* osservanze: carattere leggibile, pagina libera di occupare tutto lo spazio necessario */
  .doc-phrase{font-size:12px;line-height:1.45;padding:5px 0;border-top:1px solid #eee;}
  .doc-phrase:first-child{border-top:none;}

  /* cover page */
  .doc-cover-wrap{text-align:center;margin-top:60px;}
  .doc-cover-title{color:#007AC9;font-family:'Gill Sans MT',Corbel,Calibri,Arial,sans-serif;font-weight:700;margin-bottom:26px;}
  .doc-cover-title .l1{font-size:15px;}
  .doc-cover-title .l2{font-size:15px;text-transform:uppercase;margin:6px auto;line-height:1.4;max-width:520px;}
  .doc-cover-box{border:1px solid #007AC9;border-radius:2px;padding:10px 18px;display:inline-block;
    color:#007AC9;font-family:'Gill Sans MT',Corbel,Calibri,Arial,sans-serif;font-weight:600;letter-spacing:.3px;font-size:15px;}

  /* VISITA combo box (per il verbale di riunione il testo del tag e' piu' lungo — "RIUNIONE
     INIZIALE DI COORDINAMENTO" invece del solo "RIUNIONE" — quindi il tag deve poter restringersi
     e andare a capo su piu' righe invece di sconfinare fuori dal riquadro sulle larghezze strette;
     "VISITA" resta comunque su una riga sola, avendo margine di sovra piu' che sufficiente) */
  .doc-visita-wrap{border:1px solid #000;display:flex;margin-bottom:12px;overflow:hidden;}
  .doc-visita-tag{background:var(--doc-navy);color:#fff;font-weight:800;font-style:italic;font-size:15px;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;
    padding:10px 14px;flex:0 1 auto;min-width:0;}
  .doc-visita-fields{flex:1 1 150px;min-width:150px;display:flex;align-items:center;gap:5px;padding:10px 14px;font-size:12px;flex-wrap:wrap;}

  /* attivita table (with navy header row + pale-blue fill cells) */
  /* riquadro orari ATTIVITA' ridotto: meno padding e testo più piccolo, per lasciare spazio alle foto sotto */
  .doc-attivita{width:100%;border-collapse:collapse;margin-bottom:6px;border:1px solid #000;}
  .doc-attivita .bar-row td{background:var(--doc-navy);color:#fff;font-weight:700;padding:3px 10px;font-size:15px;border:none;}
  .doc-attivita td{border:1px solid #000;padding:1.5px 9px;font-size:12px;}
  .doc-attivita td.h{width:28px;text-align:center;}
  .doc-attivita td.v{background:var(--blue-bg);color:var(--doc-navy);font-weight:700;min-width:50px;text-align:center;}
  .doc-attivita tr.tot td{font-weight:700;}

  /* checkbox-style lists (imprese, osservanze target, destinatari, invio) */
  .doc-chk-list{margin:4px 0 10px;}
  .doc-chk-list.boxed{border:1px solid #000;padding:8px 10px 4px;}
  .doc-chk-row{display:flex;gap:6px;align-items:baseline;font-size:12px;padding:2px 0;}
  /* real Unicode ballot-box glyphs (☒ U+2612 / ☐ U+2610), matching the Wingdings-style
     checkbox glyphs used in the source docx, instead of a custom CSS box */
  .doc-chk-box{flex-shrink:0;font-size:13px;line-height:1;}
  .doc-chk-inline{display:inline-flex;gap:5px;align-items:baseline;margin-right:16px;}

  /* sospensione */
  .doc-susp-box{position:relative;}
  .doc-susp-diag{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}

  /* signatures */
  .doc-signatures{margin-top:14px;}
  .doc-sigline{margin-top:20px;text-align:right;}
  .doc-sigline .role{font-size:12px;color:#333;line-height:1.3;}
  .doc-sigline .nameline{border-bottom:1px solid #000;display:inline-block;min-width:220px;height:26px;}
  .doc-sigline .name{font-size:12px;font-weight:600;color:var(--doc-navy);margin-top:3px;}
  .doc-sigline .sig-img{display:block;max-height:50px;max-width:220px;margin:0 0 -6px auto;}

  /* footer: Gill Sans MT 9pt (12px) codes left, page count right — measured from the docx's
     bottom-of-body 2-row table (ITG code + Allegato code stacked left, "Pagina N di M" right) */
  /* margin-top:auto (with .doc-page as a flex column) pins the footer to the bottom of the page
     box regardless of how much content precedes it, instead of just trailing the content flow */
  .doc-footer{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:#000;
    font-family:'Gill Sans MT',Corbel,Arial,sans-serif;flex-shrink:0;
    border-top:1px solid var(--line);margin-top:auto;padding-top:6px;}
  .doc-footer .l{line-height:1.4;}
  @media (max-width:359px){
    .row2{grid-template-columns:1fr;}
    .row3{grid-template-columns:1fr;}
    .grid-menu{grid-template-columns:1fr;}
  }
  .btn,.iconbtn,.chip,.menu-btn,.item-row .actions button{min-height:40px;}
  input[type=checkbox],input[type=radio]{min-width:18px;min-height:18px;}

  @media print{
    body *{visibility:hidden;}
    #docview, #docview *{visibility:visible;}
    #docview{display:block !important;position:absolute;left:0;top:0;width:100%;}
    .doc-page{border:none;box-shadow:none;margin:0;page-break-after:always;border-radius:0;}
    .no-print{display:none !important;}
  }
</style>

   IndexedDB (offline, no ~5MB cap like localStorage — needed for embedded photos), falling back to
   localStorage, then in-memory, if unavailable. */
const KEYS = {cantieri:'cantieri',imprese:'imprese',personale:'personale',frasi:'frasi',
              frasiRiunione:'frasiRiunione', frasiRiunioneLibVersion:'frasiRiunioneLibVersion',
              destinatari:'destinatari', index:'verbali-index', settings:'settings', fasiLavoro:'fasiLavoro',
              fasiLavoroLibVersion:'fasiLavoroLibVersion', maintenanceMode:'maintenance-mode',

/* Password di default dell'area amministrazione nascosta (si raggiunge toccando 6 volte il logo
   in alto). Usata solo finché nelle impostazioni non ne viene salvata una diversa (cambiabile dalla
   sezione admin stessa). Vedi anche il blocco MODALITÀ AGGIORNAMENTO più sotto (richiesta 09/09/2026). */
const DEFAULT_ADMIN_PASSWORD = 'SOGLIOLINA';

const IDB_NAME = 'verbali-cse-db';
const IDB_VERSION = 1;
const IDB_STORE = 'kv';
let _idbPromise = null;
let _idbBroken = false;
const _memStore = {};

function openIDB(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB non disponibile')); return; }
    let req;
    try{ req = indexedDB.open(IDB_NAME, IDB_VERSION); }
    catch(e){ reject(e); return; }
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
    req.onblocked = ()=> reject(new Error('IndexedDB bloccato'));
  });
  return _idbPromise;
}

async function sget(key, fallback){
  if(!_idbBroken){
    try{
      const db = await openIDB();
      const val = await new Promise((resolve,reject)=>{
        const tx = db.transaction(IDB_STORE,'readonly');
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = ()=> resolve(req.result);
        req.onerror = ()=> reject(req.error);
      });
      return val===undefined ? fallback : val;
    }catch(e){ console.warn('IndexedDB non disponibile, uso storage di riserva.', e); _idbBroken = true; }
  }
  try{
    const raw = localStorage.getItem('vcse:'+key);
    return raw!==null ? JSON.parse(raw) : (key in _memStore ? _memStore[key] : fallback);
  }catch(e){ return key in _memStore ? _memStore[key] : fallback; }
}
async function sset(key, val){
  if(!_idbBroken){
    try{
      const db = await openIDB();
      await new Promise((resolve,reject)=>{
        const tx = db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
      });
      return;
    }catch(e){ console.warn('IndexedDB non disponibile, uso storage di riserva.', e); _idbBroken = true; }
  }
  try{ localStorage.setItem('vcse:'+key, JSON.stringify(val)); }
  catch(e){
    _memStore[key] = val;
    console.error('storage set failed (solo in memoria, non persistente)',key,e);
    toast('Spazio insufficiente: i dati non verranno salvati. Elimina qualche foto o verbale.');
  }
}
async function sdel(key){
  if(!_idbBroken){
    try{
      const db = await openIDB();
      await new Promise((resolve,reject)=>{
        const tx = db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).delete(key);
        tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
      });
      return;
    }catch(e){ _idbBroken = true; }
  }
  try{ localStorage.removeItem('vcse:'+key); }catch(e){}
  delete _memStore[key];
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Conferma rinforzata generica (richiesta 23/09/2026, "quando elimino prima mi deve chiedere la
   conferma e devo digitare 'elimina'", estesa lo stesso giorno a "anche qua serve la conferma con
   scritto 'confermato'" per il pulsante "Segna come completato"): al posto del semplice confirm()
   del browser (solo OK/Annulla), mostra una finestra che obbliga a digitare una parola prestabilita
   prima che il pulsante di conferma si attivi. messaggio = testo mostrato sopra il campo; parola =
   parola da digitare; onConferma = eseguita solo se l'utente digita la parola giusta e conferma
   (mai automaticamente); opts.labelBtn/opts.btnClass personalizzano il pulsante di conferma (di
   default "Elimina"/rosso, adatto alle eliminazioni). Riutilizzabile per qualsiasi conferma
   rinforzata dell'app. */
function confirmConParola(messaggio, parola, onConferma, opts){
  opts = opts || {};
  const labelBtn = opts.labelBtn || 'Elimina';
  const btnClass = opts.btnClass || 'btn danger';
  const parolaLower = parola.toLowerCase();
  const ov = document.createElement('div');
  ov.className = 'confirm-modal-overlay';
  ov.innerHTML = `
    <div class="confirm-modal-box">
      <p class="confirm-modal-msg">${esc(messaggio)}</p>
      <p class="confirm-modal-hint">Per confermare, scrivi <b>"${esc(parola)}"</b> qui sotto:</p>
      <input type="text" id="confirm-modal-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder='Scrivi "${esc(parola)}"'>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn secondary" id="confirm-modal-cancel" type="button">Annulla</button>
        <button class="${btnClass}" id="confirm-modal-ok" type="button" disabled>${esc(labelBtn)}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const input = ov.querySelector('#confirm-modal-input');
  const okBtn = ov.querySelector('#confirm-modal-ok');
  const chiudi = () => ov.remove();
  const matcha = () => input.value.trim().toLowerCase() === parolaLower;
  input.addEventListener('input', ()=>{ okBtn.disabled = !matcha(); });
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter' && matcha()){ chiudi(); onConferma(); }
    else if(e.key==='Escape'){ chiudi(); }
  });
  ov.querySelector('#confirm-modal-cancel').addEventListener('click', chiudi);
  okBtn.addEventListener('click', ()=>{ if(!matcha()) return; chiudi(); onConferma(); });
  ov.addEventListener('click', e=>{ if(e.target===ov) chiudi(); });
  setTimeout(()=>input.focus(), 50);
}
/* Alias storico: conferma di eliminazione con la parola "elimina" (comportamento invariato). */
function confirmEliminaConTesto(messaggio, onConferma){
  confirmConParola(messaggio, 'elimina', onConferma, {labelBtn:'Elimina', btnClass:'btn danger'});
}

// converte in automatico un nome provincia (per esteso, con o senza accenti/apostrofi) nella sua sigla;
// se già una sigla di 2 lettere la restituisce uppercase; se non riconosciuta, fallback sulle prime 2 lettere.
function provinciaSigla(raw){
  const t = (raw||'').trim();
  if(!t) return '';
  if(t.length<=2) return t.toUpperCase();
  const norm = t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,'');
  if(PROVINCE_SIGLE[norm]) return PROVINCE_SIGLE[norm];
  return t.slice(0,2).toUpperCase();
}

/* Verbale di riunione iniziale di coordinamento (richiesta 23/09/2026): stessa famiglia di
   documento Italgas (ITG-IOP-234-R00), Allegato 8 invece di Allegato 10. */
const DOC_ALLEGATO_NUM_RIUNIONE = '8';
const DOC_ALLEGATO_CODE_RIUNIONE = 'Allegato 8-R00';
const DOC_AGGIORNAMENTO = '03/07/2017';
/* logo is placed at the same native size (208x88px) on every single page of the source docx — no small variant */
function docLogoImg(){ return `<div class="doc-logo-row"><img class="doc-logo-img" src="${DOC_LOGO_SRC}" alt="Italgas Reti"></div>`; }
/* ☒ / ☐ = Unicode ballot box (U+2612 / U+2610), matching the Wingdings-style checkbox glyphs
   used throughout the source docx, in place of a hand-drawn CSS box */
function chkRow(on, label){
  return `<div class="doc-chk-row"><span class="doc-chk-box">${on?'☒':'☐'}</span><span>${label}</span></div>`;
}
function chkInline(on, label){
  return `<span class="doc-chk-inline"><span class="doc-chk-box">${on?'☒':'☐'}</span><span>${label}</span></span>`;
}
/* Fixed 4-row impresa schema (one row per IMPRESA_RUOLI role), always all 4 rows, checked+named
   when a company with that role exists. selectedImpresaId, if given, checks only that company's row
   (OSSERVANZE pages); otherwise every assigned role is checked (VISITA page). */
function impresaFixedRows(imprese, selectedImpresaId){
  return IMPRESA_RUOLI.map(ruolo=>{
    const inRuolo = imprese.filter(ic=>ruoliOf(ic).includes(ruolo));
    const on = selectedImpresaId!=null
      ? inRuolo.some(ic=>ic.impresaId===selectedImpresaId)
      : inRuolo.length>0;
    const label = inRuolo.length
      ? `<b>${esc(ruolo)}:</b> <span class="doc-u">${esc(inRuolo.map(ic=>ic.nome).join(', '))}</span>`
      : `<b>${esc(ruolo)}:</b>`;
    return chkRow(on, label);
  }).join('');
}
/* Verbale di riunione (Allegato 8): stesso schema fisso a 4 righe di impresaFixedRows(), con in più
   il referente indicato in riunione (nome e mansione) per ciascuna impresa di quel ruolo — richiesto
   dal modello "con: [ruolo] nella persona di ... avente mansioni di ...". */
function impresaReferentiRows(imprese){
  return IMPRESA_RUOLI.map(ruolo=>{
    const inRuolo = imprese.filter(ic=>ruoliOf(ic).includes(ruolo));
    if(!inRuolo.length) return chkRow(false, `<b>${esc(ruolo)}:</b>`);
    return inRuolo.map(ic=>{
      const label = ic.presente===false
        ? `<b>${esc(ruolo)}:</b> <span class="doc-u">${esc(ic.nome)}</span> (non presente a questa riunione)`
        : `<b>${esc(ruolo)}:</b> <span class="doc-u">${esc(ic.nome)}</span> nella persona di <span class="doc-u">${esc(ic.referenteNome)||'—'}</span> avente mansioni di <span class="doc-u">${esc(ic.referenteMansione)||'—'}</span>`;
      return chkRow(true, label);
    }).join('');
  }).join('');
}
/* Riga firma del documento stampabile (PDF/anteprima) — estratta da viewDocumento() perché serve
   identica anche in viewDocumentoRiunione(). */
function docSigLine(role, name, img){
  return `<div class="doc-sigline"><div class="role">${role}</div>${img?`<img class="sig-img" src="${img}">`:''}<div class="nameline"></div><div class="name">${esc(name)||' '}</div></div>`;
}

// (PDF e Word) del verbale di riunione iniziale — la libreria è un aiuto alla compilazione, ma nel
// documento finale compare come un unico blocco di testo "Note del CSE".
function noteCseTestoCompleto(v){
  const daLibreria = (v.noteCSESelFrasi||[]).map(id=>{
    const f = (DB.frasiRiunione||[]).find(x=>x.id===id);
    return f ? f.testo : null;
  }).filter(Boolean);
  const parti = daLibreria.slice();
  if(v.noteCSE && v.noteCSE.trim()) parti.push(v.noteCSE.trim());
  return parti.join('\n\n');
}
// stesso meccanismo di noteCseTestoCompleto(), riusato per i tre punti di "Verifiche del CSE"
// (POS / art. 102 / organizzazione) — stessa Libreria note riunioni, richiesta 24/09/2026 via
// commento sull'Artifact ("qua bisogna poter selezionare delle note da una libreria... ed
// aggiungere note libere", gia' fatto per "Note del CSE" e ora estesa qui per coerenza).
function verificaTestoCompleto(v, key){
  const ve = v.verifiche[key];
  const daLibreria = (ve.selFrasi||[]).map(id=>{
    const f = (DB.frasiRiunione||[]).find(x=>x.id===id);
    return f ? f.testo : null;
  }).filter(Boolean);
  const parti = daLibreria.slice();
  if(ve.testo && ve.testo.trim()) parti.push(ve.testo.trim());
  return parti.join('\n\n');
}
// stesso meccanismo, per "Verifica di eventuali variazioni progettuali" (Ordine del giorno) — richiesta
// 24/09/2026 via commento sull'Artifact ("aggiungi opzione di spuntare dalla libreria dalla categoria
// variazioni progettuali"). Qui si selezionano frasi solo dalla categoria "variazioniProgettuali".
function variazioniTestoCompleto(v){
  const vz = v.ordineGiorno.variazioni;
  const daLibreria = (vz.selFrasi||[]).map(id=>{
    const f = (DB.frasiRiunione||[]).find(x=>x.id===id);
    return f ? f.testo : null;
  }).filter(Boolean);
  const parti = daLibreria.slice();
  if(vz.testo && vz.testo.trim()) parti.push(vz.testo.trim());
  return parti.join('\n\n');
}

async function loadVerbale(id){
  const v = await sget('verbale:'+id, null);
  if(!v) return null;
  // defensive defaults for older saved records
  v.presentiPersonale = v.presentiPersonale || [];
  v.altriPresenti = v.altriPresenti || v.presenti || [];
  v.assistenteCSE = v.assistenteCSE || '';
  v.comune = v.comune || '';
  v.provincia = v.provincia || '';
  v.tipologiaLavoro = v.tipologiaLavoro || '';
  v.provincia = provinciaSigla(v.provincia);
  v.tipo = v.tipo || 'visita'; // verbali salvati prima del 23/09/2026 (verbale di riunione) sono tutti 'visita'
  if(v.tipo==='riunione'){
    v.impreseCoinvolte = v.impreseCoinvolte || [];
    v.ordineGiorno = v.ordineGiorno || {variazioni:{checked:false,testo:''}, verificaDoc:{checked:false,affidataria:'',subappalto:'',autonomi:''}};
    v.ordineGiorno.verificaDoc.affidatariaAltro = v.ordineGiorno.verificaDoc.affidatariaAltro || false;
    v.ordineGiorno.verificaDoc.subappaltoAltro = v.ordineGiorno.verificaDoc.subappaltoAltro || false;
    v.ordineGiorno.verificaDoc.autonomiAltro = v.ordineGiorno.verificaDoc.autonomiAltro || false;
    // selezione dalla Libreria note riunioni (categoria "variazioniProgettuali"), richiesta 24/09/2026
    // via commento sull'Artifact — verbali salvati prima non hanno ancora questo campo.
    v.ordineGiorno.variazioni.selFrasi = v.ordineGiorno.variazioni.selFrasi || [];
    v.verifiche = v.verifiche || {pos:{checked:false,testo:'',selFrasi:[]}, art102:{checked:false,testo:'',selFrasi:[]}, organizzazione:{checked:false,testo:'',selFrasi:[]}};
    ['pos','art102','organizzazione'].forEach(k=>{ v.verifiche[k].selFrasi = v.verifiche[k].selFrasi || []; });
    v.rls = v.rls || [];
    // compat: verbali salvati prima della selezione impresa da tendina (24/09/2026) non hanno
    // ancora `ruolo`/`impresaNome`/`impresaAltro` sulle righe RLS/RLST — dedotto dal testo del label.
    v.rls.forEach(r=>{
      if(r.ruolo===undefined){
        r.ruolo = /impresa affidataria/i.test(r.label) ? 'Impresa affidataria'
          : /impresa esecutrice/i.test(r.label) ? 'Impresa esecutrice' : null;
      }
      if(r.impresaNome===undefined) r.impresaNome='';
      if(r.impresaAltro===undefined) r.impresaAltro=false;
    });
    v.rlsNote = v.rlsNote || '';
    v.noteCSE = v.noteCSE || '';
    v.noteCSESelFrasi = v.noteCSESelFrasi || [];
    v.prossimaRiunione = v.prossimaRiunione || '';
    v.oraRedazione = v.oraRedazione || ''; // dal 23/09/2026: ora (non piu' un valore libero "ore") — vedi totalHoursRiunione
    if(v.firmaCSEImg===undefined) v.firmaCSEImg = null;
  }
  (v.impreseCoinvolte||[]).forEach(i=>{ if(!i.ruoli || !i.ruoli.length) i.ruoli = i.ruolo ? [i.ruolo] : [IMPRESA_RUOLI[0]]; });
  v.firmaExtra = v.firmaExtra || {label:'Altra firma', nome:''};
  if(v.firmaExtra.img===undefined) v.firmaExtra.img = null;
  if(v.firmaCSEImg===undefined) v.firmaCSEImg = null;
  if(v.assistenteCSEImg===undefined) v.assistenteCSEImg = null;
  (v.impreseCoinvolte||[]).forEach(i=>{ if(i.preposto===undefined) i.preposto=''; if(i.firmaPrepostoImg===undefined) i.firmaPrepostoImg=null; if(i.prepostoAltro===undefined) i.prepostoAltro=false; });
  (v.impreseCoinvolte||[]).forEach(i=>{ if(i.referenteNome===undefined) i.referenteNome=''; if(i.referenteMansione===undefined) i.referenteMansione=''; if(i.referenteNomeAltro===undefined) i.referenteNomeAltro=false; });
  // presente a questa riunione — distinto dal ruolo (coinvolgimento nel cantiere): un'impresa già
  // presente nei verbali (o aggiunta prima di questo aggiornamento) resta "presente" di default, per
  // non perdere referenti già compilati (richiesta 24/09/2026, vedi wizImpreseRiunione).
  (v.impreseCoinvolte||[]).forEach(i=>{ if(i.presente===undefined) i.presente=true; });
  return v;
}
async function saveVerbale(v){
  await sset('verbale:'+v.id, v);
  const idx = DB.verbaliIndex.findIndex(x=>x.id===v.id);
  const entry = {id:v.id, numero:v.numero, anno:v.anno, cantiereId:v.cantiereId, cantiereNome:v.cantiereNome,
                 data:v.data, stato:v.stato||'bozza', createdAt:v.createdAt, cse:v.cse||'', tipo:v.tipo||'visita'};
  if(idx>=0) DB.verbaliIndex[idx]=entry; else DB.verbaliIndex.unshift(entry);
  await sset(KEYS.index, DB.verbaliIndex);
  cloudSyncVerbaleIndice(entry, v);
}
async function deleteVerbale(id){
  // prima di eliminarlo per davvero dall'indice/cloud, ne salvo una copia completa nel Cestino
  // (richiesta 23/09/2026) cosi' resta ripristinabile per 10 giorni.
  const v = await loadVerbale(id);
  const entry = DB.verbaliIndex.find(x=>x.id===id);
  if(v && entry){
    await spostaInCestino('verbale', `Verbale n° ${entry.numero}/${entry.anno} — ${entry.cantiereNome||''}`,
      `${entry.stato==='finale'?'finalizzato':'bozza'} · ${fmtDate(entry.data)}`, {verbale:v, indiceEntry:entry});
  }
  await sdel('verbale:'+id);
  DB.verbaliIndex = DB.verbaliIndex.filter(x=>x.id!==id);
  await sset(KEYS.index, DB.verbaliIndex);
  cloudDeleteVerbaleIndice(id);
}

/* Conferma rinforzata per l'eliminazione di un verbale (foto e contenuto compilato spariscono
   dall'archivio): oltre al messaggio, chiede di ridigitare una parola chiave prima di procedere,
   invece del semplice OK/Annulla usato per le altre eliminazioni dell'app (richiesta 09/09/2026,
   commento sull'Artifact). Da quando esiste il Cestino (23/09/2026) il verbale non va comunque
   perso subito: resta ripristinabile per 10 giorni, vedi spostaInCestino/deleteVerbale sopra. */
function confirmWithKeyword(message, keyword){
  const input = prompt(message + '\n\nPer confermare, scrivi "' + keyword + '" e premi OK:');
  return input !== null && input.trim().toUpperCase() === keyword.toUpperCase();
}

/* ======================= CESTINO (richiesta 23/09/2026: "cestino...dove ogni cosa eliminata rimane
   qui per 10 giorni") =======================
   Ogni eliminazione dell'app (cantieri, imprese — con il personale collegato, dipendenti, destinatari,
   frasi della Libreria osservanze, voci/categorie della Libreria fasi di lavoro, verbali) passa da qui
   invece di sparire subito per sempre: la cosa eliminata resta in DB.cestino, ripristinabile con un
   tocco, e viene rimossa DEFINITIVAMENTE solo dopo CESTINO_GIORNI_RITENZIONE giorni (o prima, a mano,
   dalla schermata Cestino). Il conto account CSE (data-del-account) NON passa dal Cestino: non è un
   dato di cantiere ma un profilo locale di accesso all'app. */
const CESTINO_GIORNI_RITENZIONE = 10;
async function spostaInCestino(tipo, etichetta, dettaglio, dati){
  DB.cestino = DB.cestino || [];
  DB.cestino.unshift({id:uid(), tipo, etichetta, dettaglio: dettaglio||'', eliminatoIl: todayISO(), dati});
  await sset(KEYS.cestino, DB.cestino);
}
// giorni pieni rimasti prima della rimozione definitiva automatica (0 = verrà rimosso al prossimo avvio/purga)
function cestinoGiorniRimasti(eliminatoIl){
  if(!eliminatoIl) return 0;
  const elim = new Date(eliminatoIl+'T00:00:00');
  const oggi = new Date(todayISO()+'T00:00:00');
  const trascorsi = Math.round((oggi-elim)/(1000*60*60*24));
  return Math.max(0, CESTINO_GIORNI_RITENZIONE - trascorsi);
}
async function purgaCestinoScaduto(){
  if(!DB.cestino || !DB.cestino.length) return;
  const primaCount = DB.cestino.length;
  DB.cestino = DB.cestino.filter(e=>cestinoGiorniRimasti(e.eliminatoIl) > 0);
  if(DB.cestino.length !== primaCount) await sset(KEYS.cestino, DB.cestino);
}
async function ripristinaDaCestino(cestinoId){
  const idx = DB.cestino.findIndex(e=>e.id===cestinoId);
  if(idx<0) return;
  const entry = DB.cestino[idx];
  switch(entry.tipo){
    case 'cantiere':
      DB.cantieri.push(entry.dati);
      await sset(KEYS.cantieri, DB.cantieri);
      break;
    case 'impresa':
      DB.imprese.push(entry.dati.impresa);
      DB.personale.push(...(entry.dati.personale||[]));
      await sset(KEYS.imprese, DB.imprese);
      await sset(KEYS.personale, DB.personale);
      break;
    case 'personale':
      DB.personale.push(entry.dati);
      await sset(KEYS.personale, DB.personale);
      if(!DB.imprese.some(i=>i.id===entry.dati.impresaId)){
        toast('Dipendente ripristinato, ma l\'impresa collegata non esiste più');
      }
      break;
    case 'destinatario':
      DB.destinatari.push(entry.dati);
      await sset(KEYS.destinatari, DB.destinatari);
      break;
    case 'frase':
      DB.frasi.push(entry.dati);
      await sset(KEYS.frasi, DB.frasi);
      break;
    case 'fraseRiunione':
      DB.frasiRiunione.push(entry.dati);
      await sset(KEYS.frasiRiunione, DB.frasiRiunione);
      break;
    case 'faseVoce': {
      const cat = DB.fasiLavoro.find(c=>(c.categoria||'').trim().toLowerCase()===(entry.dati.categoriaNome||'').trim().toLowerCase());
      if(cat) cat.voci.push(entry.dati.voce);
      else DB.fasiLavoro.push({categoria: entry.dati.categoriaNome, voci:[entry.dati.voce]});
      await sset(KEYS.fasiLavoro, DB.fasiLavoro);
      break;
    }
    case 'faseCategoria': {
      const esistente = DB.fasiLavoro.find(c=>(c.categoria||'').trim().toLowerCase()===(entry.dati.categoria||'').trim().toLowerCase());
      if(esistente) esistente.voci.push(...(entry.dati.voci||[]));
      else DB.fasiLavoro.push(entry.dati);
      await sset(KEYS.fasiLavoro, DB.fasiLavoro);
      break;
    }
    case 'verbale':
      await sset('verbale:'+entry.dati.verbale.id, entry.dati.verbale);
      DB.verbaliIndex.unshift(entry.dati.indiceEntry);
      await sset(KEYS.index, DB.verbaliIndex);
      cloudSyncVerbaleIndice(entry.dati.indiceEntry, entry.dati.verbale);
      break;
  }
  DB.cestino.splice(idx,1);
  await sset(KEYS.cestino, DB.cestino);
  toast('Ripristinato');
  render();
}
async function eliminaDefinitivamenteDaCestino(cestinoId){
  DB.cestino = DB.cestino.filter(e=>e.id!==cestinoId);
  await sset(KEYS.cestino, DB.cestino);
  render();
}

/* ======================= SINCRONIZZAZIONE CLOUD DELL'INDICE VERBALI (tra dispositivi) =======================
   Sincronizza in tempo reale solo un riepilogo di ogni verbale (cantiere, data, numero, compilatore),
   MAI foto/checklist/firme: quelle restano solo sul dispositivo che ha creato il verbale (in Archivio,
   i verbali altrui compaiono "di sola consultazione"). Attivo solo nella app pubblicata (capacità "db"
   della piattaforma Claude); nel file HTML scaricabile resta no-op e l'app funziona solo in locale. */
let CLOUD_DB = null;
let CLOUD_VERBALI = [];
async function initCloudSync(){
  try{
    if(!window.claude || typeof window.claude.use!=='function') return; // file HTML scaricabile: nessuna sincronizzazione
    CLOUD_DB = await window.claude.use('db');
    if(!CLOUD_DB) return; // capacità non disponibile in questa vista
    CLOUD_DB.collection('verbali').orderBy('createdAt','desc').limit(500).onSnapshot(
      snap => { CLOUD_VERBALI = snap.docs.map(d=>({id:d.id, ...d.data()})); if(ROUTE.name==='archivio') render(); },
      err => { console.error('sincronizzazione archivio verbali non riuscita', err); }
    );
    // Modalità aggiornamento: sincronizzata tra tutti i dispositivi che usano il link pubblicato
    // dell'app, così attivandola dall'area admin di un dispositivo compare subito su tutti gli altri.
    CLOUD_DB.collection('config').doc('maintenance').onSnapshot(
      doc => {
        const data = doc && typeof doc.data === 'function' ? doc.data() : null;
        const active = !!(data && data.attiva);
        if(active !== MAINTENANCE_MODE){
          const wasActive = MAINTENANCE_MODE;
          MAINTENANCE_MODE = active;
          sset(KEYS.maintenanceMode, active);
          if(wasActive && !active) maybeNotifyMaintenanceOver();
          render();
        }
      },
      err => { console.error('sincronizzazione modalità aggiornamento non riuscita', err); }
    );
  }catch(e){ console.error(e); }
}
/* Attiva/disattiva la modalità aggiornamento dall'area admin. Salva sempre una copia locale (così
   l'interruttore resta coerente anche offline o nel file HTML scaricato, dove non esiste un CLOUD_DB
   condiviso), e in più, quando disponibile, la sincronizza su CLOUD_DB perché l'effetto sia visibile
   in tempo reale su tutti i dispositivi collegati alla versione pubblicata dell'app. */
async function setMaintenanceMode(active){
  const wasActive = MAINTENANCE_MODE;
  MAINTENANCE_MODE = active;
  await sset(KEYS.maintenanceMode, active);
  try{
    if(CLOUD_DB) await CLOUD_DB.collection('config').doc('maintenance').set({attiva:active, aggiornatoIl:new Date().toISOString()});
  }catch(e){ console.error('impossibile sincronizzare la modalità aggiornamento su tutti i dispositivi (resta comunque attiva su questo)', e); }
  if(wasActive && !active) maybeNotifyMaintenanceOver();
  render();
}
/* Mostra la notifica "Aggiornamento completato" su questo dispositivo, se l'utente l'aveva richiesta
   toccando "Avvisami quando è pronto" nella schermata di aggiornamento. Consuma la richiesta (una
   tantum): va ritoccato il pulsante per essere avvisati di un eventuale aggiornamento successivo.
   Richiede il permesso "Notifiche" del browser, già concesso in precedenza (vedi il gestore del
   pulsante in attachHandlers()): se il permesso non c'è più (es. revocato dall'utente nel frattempo)
   la notifica viene semplicemente saltata, senza errori per l'utente. */
function maybeNotifyMaintenanceOver(){
  if(!NOTIFY_ON_MAINT_OFF) return;
  NOTIFY_ON_MAINT_OFF = false;
  sset(KEYS.notifyWhenReady, false);
  try{
    if(typeof Notification !== 'function' || Notification.permission !== 'granted') return;
    const logoImg = document.querySelector('.brand-logo-wrap img');
    new Notification('Aggiornamento completato', {
      body: 'L\'app Verbali CSE è di nuovo disponibile.',
      icon: logoImg ? logoImg.src : undefined
    });
  }catch(e){ console.error('impossibile mostrare la notifica di fine aggiornamento', e); }
}
async function cloudSyncVerbaleIndice(entry, v){
  try{
    if(!CLOUD_DB) return;
    await CLOUD_DB.collection('verbali').doc(entry.id).set({
      numero: entry.numero, anno: entry.anno,
      cantiereId: entry.cantiereId, cantiereNome: entry.cantiereNome,
      comune: v.comune||'', provincia: v.provincia||'', sito: v.sito||'', tipologiaLavoro: v.tipologiaLavoro||'',
      data: entry.data, stato: entry.stato, createdAt: entry.createdAt,
      cse: v.cse||'', tipo: v.tipo||'visita', aggiornatoIl: new Date().toISOString(),
    });
  }catch(e){ console.error('sincronizzazione cloud del verbale non riuscita (il verbale resta comunque salvato in locale)', e); }
}
async function cloudDeleteVerbaleIndice(id){
  try{ if(CLOUD_DB) await CLOUD_DB.collection('verbali').doc(id).delete(); }catch(e){ console.error(e); }
}

/* Numerazione progressiva per cantiere/anno — richiesta 23/09/2026: il verbale di riunione iniziale
   di coordinamento (Allegato 8) usa una serie di numerazione propria, separata da quella dei verbali
   di visita (Allegato 10), come nel modello di riferimento ("n° __/20__" della riunione). I verbali
   salvati prima di questa modifica non hanno un campo "tipo": vengono trattati come 'visita'. */
function nextNumero(cantiereId, tipo){
  tipo = tipo || 'visita';
  const year = new Date().getFullYear();
  const count = DB.verbaliIndex.filter(v=>v.cantiereId===cantiereId && v.anno===year && (v.tipo||'visita')===tipo).length;
  return {numero:count+1, anno:year};
}

    fasiLavoro: '',

/* ======================= ROUTER ======================= */
function go(route){ ROUTE = route; window.scrollTo(0,0); render(); }

function render(){
  const app=document.getElementById('app');
  let html='';
  // Modalità aggiornamento attiva: chiunque non sia già nell'area admin vede la schermata di
  // aggiornamento al posto dell'app normale (accesso all'area admin sempre possibile toccando 6
  // volte il logo, indipendentemente da questa modalità — vedi listener vicino a boot()).
  if(MAINTENANCE_MODE && ROUTE.name!=='admin-login' && ROUTE.name!=='admin'){
    app.innerHTML = viewAggiornamento();
    attachHandlers();
    updateProfileBadge();
    return;
  }
  switch(ROUTE.name){
    case 'accesso': html=viewAccesso(); break;
    case 'admin-login': html=viewAdminLogin(); break;
    case 'admin': html = ADMIN_UNLOCKED ? viewAdmin() : viewAdminLogin(); break;
    case 'home': html=viewHome(); break;
    case 'cantieri': html=viewCantieri(); break;
    case 'cantieriCompletati': html=viewCantieriCompletati(); break;
    case 'cestino': html=viewCestino(); break;
    case 'cantiere-edit': html=viewCantiereEdit(ROUTE.id); break;
    case 'imprese': html=viewImprese(); break;
    case 'impresa-edit': html=viewImpresaEdit(ROUTE.id); break;
    case 'personale': html=viewPersonale(); break;
    case 'personale-edit': html=viewPersonaleEdit(ROUTE.id); break;
    case 'personale-import': html=viewPersonaleImport(ROUTE.impresaId); break;
    case 'frasi': html=viewFrasi(); break;
    case 'frasi-riunione': html=viewFrasiRiunione(); break;
    case 'fasiLibreria': html=viewFasiLibreria(); break;
    case 'profilo': html=viewProfilo(); break;
    case 'destinatari': html=viewDestinatari(); break;
    case 'destinatario-edit': html=viewDestinatarioEdit(ROUTE.id); break;
    case 'trasferimento-dati': html=viewTrasferimentoDati(); break;
    case 'archivio': html=viewArchivio(); break;
    case 'wizard': html=viewWizard(ROUTE.step); break;
    case 'anteprima': html = (CURRENT_VERBALE && CURRENT_VERBALE.tipo==='riunione') ? viewAnteprimaRiunione() : viewAnteprima(); break;
    case 'documento': html=viewDocumento(); break;
    default: html=viewHome();
  }
  app.innerHTML = html;
  attachHandlers();
  updateProfileBadge();
}

function significantWords(name){
  return (name||'').trim().split(/\s+/).filter(w=>!/\.$/.test(w) && w.length>0);
}
function initialsFromName(name){
  const words = significantWords(name);
  const letters = words.slice(0,2).map(w=>w[0].toUpperCase()).join('');
  return letters || (name||'').trim().charAt(0).toUpperCase() || '?';
}
function firstNameFrom(name){
  const words = significantWords(name);
  return words[0] || (name||'').trim();
}
function setActiveCse(name){
  name = (name||'').trim();
  if(!name) return false;
  if(!DB.settings.cseAccounts.includes(name)) DB.settings.cseAccounts.push(name);
  DB.settings.cseDefault = name;
  return true;
}

function updateProfileBadge(){
  const badge = document.getElementById('profile-badge');
  const header = document.querySelector('.brand-header');
  if(header) header.classList.toggle('centered', ROUTE.name==='accesso');
  if(typeof syncHeaderHeight==='function') syncHeaderHeight();
  if(!badge) return;
  const name = DB.settings && DB.settings.cseDefault;
  if(ROUTE.name==='accesso' || !name){ badge.style.visibility='hidden'; return; }
  document.getElementById('profile-badge-name').textContent = 'Ciao ' + firstNameFrom(name);
  document.getElementById('profile-badge-avatar').textContent = initialsFromName(name);
  badge.style.visibility='visible';
}

/* ======================= IMPRESE ======================= */
/* Ricerca + ordinamento + menù a tendina per iniziale (richiesta 23/09/2026: "metti una barra di
   ricerca e un filtro per ordine alfabetico, poi crea un menù a tendina per ogni lettera che
   contenga tutte le imprese che iniziano con quella lettera"). Stesso stile a riquadro dei gruppi
   già usati per Personale (classe .pers-group), chiusi di default; l'ordinamento (A-Z/Z-A) rifà il
   render (come già per "Ordina per" in Destinatari), la ricerca filtra dal vivo per non perdere
   il focus mentre si digita (come Personale/Destinatari). */
function viewImprese(){
  if(DB.imprese.length===0){
    return topWrap('Imprese','', `<section class="block">${emptyState('🏢','Nessuna impresa archiviata','Aggiungi le imprese che partecipano ai cantieri.')}</section>
      <div class="fab"><button class="btn" data-go="impresa-edit-new">＋ Nuova impresa</button></div>`);
  }
  ROUTE.filtriImprese = ROUTE.filtriImprese || {search:'', ordine:'nome-asc'};
  const ordine = ROUTE.filtriImprese.ordine || 'nome-asc';
  const desc = ordine==='nome-desc';
  const search = ROUTE.filtriImprese.search || '';
  const ordineOptions = [
    {v:'nome-asc', l:'Nome (A-Z)'}, {v:'nome-desc', l:'Nome (Z-A)'}
  ].map(o=>`<option value="${o.v}" ${ordine===o.v?'selected':''}>${o.l}</option>`).join('');

  const gruppi = new Map();
  DB.imprese.forEach(i=>{
    const primaLettera = (i.nome||'').trim().charAt(0).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    const key = /[A-Z]/.test(primaLettera) ? primaLettera : '#';
    if(!gruppi.has(key)) gruppi.set(key, []);
    gruppi.get(key).push(i);
  });
  const lettere = [...gruppi.keys()].sort((a,b)=> (desc?-1:1) * a.localeCompare(b,'it'));

  const groupsHtml = lettere.map(lettera=>{
    const imprese = gruppi.get(lettera).slice()
      .sort((a,b)=> (desc?-1:1) * (a.nome||'').localeCompare((b.nome||''), 'it'));
    const rows = imprese.map(i=>{
      const n = DB.personale.filter(p=>p.impresaId===i.id).length;
      const searchBlob = `${i.nome} ${i.referente||''} ${i.email||''}`.toLowerCase();
      return `
      <div class="item-row" data-impresa-search="${esc(searchBlob)}">
        <div class="main"><div class="t">${esc(i.nome)}</div><div class="s">${esc(i.referente||'')} ${i.email?'· '+esc(i.email):''} · ${n} dipendenti</div></div>
        <div class="actions">
          <button class="iconbtn" data-edit-impresa="${i.id}">Modifica</button>
          <button class="iconbtn" data-del-impresa="${i.id}">🗑</button>
        </div>
      </div>`;
    }).join('');
    return `
    <details class="pers-group" data-lettera="${esc(lettera)}" ${IMPRESE_LETTERA_OPEN[lettera]?'open':''}>
      <summary>
        <span class="name">${lettera==='#'?'Altro':lettera}<span class="cnt">(${imprese.length})</span></span>
        <span class="arrow">▶</span>
      </summary>
      <div class="pers-body">
        ${rows}
        <div class="hint imprese-filtered-hint" style="display:none;">Nessuna impresa corrisponde alla ricerca.</div>
      </div>
    </details>`;
  }).join('');

  return topWrap('Imprese','', `
    <section class="block">
      <label>Cerca</label>
      <input type="text" id="imprese-search" placeholder="Cerca per nome, referente o email…" value="${esc(search)}">
      <label>Ordina per</label>
      <select id="imprese-filter-ordine">${ordineOptions}</select>
    </section>
    ${groupsHtml}
    <div class="fab"><button class="btn" data-go="impresa-edit-new">＋ Nuova impresa</button></div>
  `);
}
/* Filtra dal vivo (senza re-render, per non perdere il focus della ricerca) le righe già presenti
   nella sezione Imprese, in base a ROUTE.filtriImprese.search — stesso meccanismo di
   applyPersonaleFiltri/applyDestinatariFiltroRicerca. Apre in automatico i gruppi (lettere) con
   corrispondenze e chiude quelli senza. */
function applyImpreseFiltro(){
  const q = (ROUTE.filtriImprese && ROUTE.filtriImprese.search || '').trim().toLowerCase();
  document.querySelectorAll('#app .pers-group[data-lettera]').forEach(group=>{
    const rows = [...group.querySelectorAll('.item-row[data-impresa-search]')];
    let anyVisible = rows.length===0;
    rows.forEach(row=>{
      const visible = !q || row.dataset.impresaSearch.includes(q);
      row.style.display = visible ? '' : 'none';
      if(visible) anyVisible = true;
    });
    const hint = group.querySelector('.imprese-filtered-hint');
    if(hint) hint.style.display = (rows.length>0 && !anyVisible) ? '' : 'none';
    if(q) group.open = anyVisible;
  });
}

/* Filtra dal vivo (senza re-render, per non perdere il focus della ricerca) le voci
   già presenti nel DOM della sezione Personale, in base a PERSONALE_FILTRI. Apre in automatico
   le imprese (menù a tendina) che contengono risultati quando c'è una ricerca/filtro mansione attivi. */
function applyPersonaleFiltri(){
  const q = (PERSONALE_FILTRI.search||'').trim().toLowerCase();
  const impFilter = PERSONALE_FILTRI.impresaId||'';
  const mansFilter = PERSONALE_FILTRI.mansione||'';
  const filtroTestualeAttivo = !!(q || mansFilter);
  document.querySelectorAll('#app .pers-group').forEach(group=>{
    const impMatch = !impFilter || impFilter===group.dataset.impresaId;
    group.style.display = impMatch ? '' : 'none';
    if(!impMatch) return;
    const rows = [...group.querySelectorAll('.item-row[data-pers-search]')];
    let anyVisible = rows.length===0;
    rows.forEach(row=>{
      const textMatch = !q || row.dataset.persSearch.includes(q);
      const mansMatch = !mansFilter || row.dataset.persMansione===mansFilter;
      const visible = textMatch && mansMatch;
      row.style.display = visible ? '' : 'none';
      if(visible) anyVisible = true;
    });
    const hint = group.querySelector('.pers-filtered-hint');
    if(hint) hint.style.display = (rows.length>0 && !anyVisible) ? '' : 'none';
    if(filtroTestualeAttivo) group.open = anyVisible;
    else if(impFilter) group.open = true;
  });
}
/* Riordina dal vivo (senza re-render, stesso motivo di applyPersonaleFiltri) le righe già presenti
   in ciascun riquadro impresa quando cambia "Ordina per" — sposta i nodi DOM esistenti invece di
   ricrearli, così i pulsanti "Modifica"/"Elimina" restano collegati e i riquadri aperti non si
   richiudono (richiesta 10/09/2026, stesso ordinamento alfabetico già aggiunto ai Destinatari). */
function reorderPersonaleGroups(){
  const desc = PERSONALE_FILTRI.ordine==='nome-desc';
  document.querySelectorAll('#app .pers-group .pers-body').forEach(body=>{
    const rows = [...body.querySelectorAll('.item-row[data-pers-nome]')];
    rows.sort((a,b)=> (desc?-1:1) * a.dataset.persNome.localeCompare(b.dataset.persNome, 'it'));
    const hint = body.querySelector('.pers-filtered-hint');
    rows.forEach(row=> body.insertBefore(row, hint||null));
  });
}

function parsePersonaleLines(text){
  return (text||'').split('\n').map(l=>l.trim()).filter(l=>l.length).map(line=>{
    let parts;
    if(line.includes('\t')) parts = line.split('\t');
    else if(line.includes(';')) parts = line.split(';');
    else if(line.includes(',')) parts = line.split(',');
    else if(line.includes(' - ')) parts = line.split(' - ');
    else if(line.includes(' – ')) parts = line.split(' – ');
    else parts = [line];
    parts = parts.map(s=>s.trim());
    const nomeCompleto = parts[0]||'';
    const mansione = parts[1]||'';
    const words = nomeCompleto.split(/\s+/).filter(Boolean);
    let nome='', cognome='';
    if(words.length>=2){ cognome = words[words.length-1]; nome = words.slice(0,-1).join(' '); }
    else { nome = words[0]||''; }
    return {nome, cognome, mansione};
  });
}

// un destinatario ha un ruolo fisso (RUOLI_DESTINATARIO) oppure un ruolo libero (scelto come "Altro" in
// modifica, o mai compilato) — quest'ultimo caso è filtrabile a parte, così ogni destinatario ricade
// sempre in una sola categoria del filtro (richiesta 10/09/2026: filtro per ruolo come per il Personale).
function isRuoloFissoDestinatario(d){
  return RUOLI_DESTINATARIO.some(r=>r.toLowerCase()===(d.ruolo||'').toLowerCase());
}
function viewDestinatari(){
  ROUTE.filtriDest = ROUTE.filtriDest || {ruolo:'', ordine:'nome-asc', search:''};
  const ruoloFiltro = ROUTE.filtriDest.ruolo || '';
  const ordine = ROUTE.filtriDest.ordine || 'nome-asc';
  const searchFiltro = (ROUTE.filtriDest.search||'').trim().toLowerCase();
  const matchRuolo = d => !ruoloFiltro
    || (ruoloFiltro===RUOLO_ALTRO ? !isRuoloFissoDestinatario(d) : (d.ruolo||'').toLowerCase()===ruoloFiltro.toLowerCase());
  const matchSearch = d => !searchFiltro
    || `${d.nome} ${d.ruolo||''} ${d.email||''}`.toLowerCase().includes(searchFiltro);

  const ruoloOptions = [`<option value="">Tutti i ruoli</option>`]
    .concat(RUOLI_DESTINATARIO.map(r=>`<option value="${esc(r)}" ${ruoloFiltro===r?'selected':''}>${esc(r)}</option>`))
    .concat([`<option value="${RUOLO_ALTRO}" ${ruoloFiltro===RUOLO_ALTRO?'selected':''}>Altro / non specificato</option>`])
    .join('');
  const ordineOptions = [
    {v:'nome-asc', l:'Nome (A-Z)'}, {v:'nome-desc', l:'Nome (Z-A)'}
  ].map(o=>`<option value="${o.v}" ${ordine===o.v?'selected':''}>${o.l}</option>`).join('');

  const destFiltrati = DB.destinatari.filter(matchRuolo).filter(matchSearch)
    .sort((a,b)=> (ordine==='nome-desc'?-1:1) * (a.nome||'').localeCompare((b.nome||''), 'it'));
  const rowsHtml = destFiltrati.map(d=>{
    const searchBlob = `${d.nome} ${d.ruolo||''} ${d.email||''}`.toLowerCase();
    return `
    <div class="item-row" data-dest-search="${esc(searchBlob)}">
      <div class="main"><div class="t">${esc(d.nome)}</div><div class="s">${esc(d.ruolo||'')} ${d.email?'· '+esc(d.email):''}</div></div>
      <div class="actions">
        <button class="iconbtn" data-edit-dest="${d.id}">Modifica</button>
        <button class="iconbtn" data-del-dest="${d.id}">🗑</button>
      </div>
    </div>`;
  }).join('');
  const items = rowsHtml
    ? rowsHtml + `<div class="hint dest-filtered-hint" id="dest-filtered-hint" style="display:none;">Nessun destinatario corrisponde ai filtri.</div>`
    : (DB.destinatari.length===0
      ? emptyState('✉️','Nessun destinatario','Aggiungi le persone a cui invii i verbali (Committente, DL, RL, imprese…).')
      : `<div class="hint">Nessun destinatario corrisponde ai filtri.</div>`);
  const filtroHtml = DB.destinatari.length===0 ? '' : `
    <section class="block">
      <label>Cerca</label>
      <input type="text" id="dest-search" placeholder="Cerca per nome, ruolo o email…" value="${esc(ROUTE.filtriDest.search||'')}">
      <div class="row2">
        <div><label>Filtra per ruolo</label><select id="dest-filter-ruolo">${ruoloOptions}</select></div>
        <div><label>Ordina per</label><select id="dest-filter-ordine">${ordineOptions}</select></div>
      </div>
    </section>`;
  return topWrap('Destinatari','', `
    ${filtroHtml}
    <section class="block">${items}</section>
    <div class="fab"><button class="btn" data-go="destinatario-edit-new">＋ Nuovo destinatario</button></div>
  `);
}

/* Filtro di ricerca Destinatari: aggiorna dal vivo la visibilità delle righe già presenti in pagina
   (stesso motivo di applyPersonaleFiltri/reorderPersonaleGroups) invece di richiamare render() ad ogni
   tasto premuto, così il campo di ricerca non perde il focus mentre si digita (richiesta 10/09/2026). */
function applyDestinatariFiltroRicerca(){
  const q = (ROUTE.filtriDest && ROUTE.filtriDest.search || '').trim().toLowerCase();
  let visibili = 0;
  document.querySelectorAll('#app .item-row[data-dest-search]').forEach(row=>{

  if(hint) hint.style.display = visibili===0 ? '' : 'none';
}
